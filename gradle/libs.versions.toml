[versions]
# Only versions shared by more than one coordinate. Single-use versions stay inline below.
paper = "1.21.11-R0.1-SNAPSHOT"
lombok = "1.18.46"
redprotect = "8.1.2"

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
run-paper = { id = "xyz.jpenilla.run-paper", version = "3.1.0" }

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# Shaded into the plugin jar and relocated under github.nighter.smartspawner.libs.
hikaricp = { module = "com.zaxxer:HikariCP", version = "7.1.0" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version = "3.5.10" }
bstats = { module = "org.bstats:bstats-bukkit", version = "3.2.1" }

# Not shaded: the driver derives its native library path from its own package name, so relocating
# it breaks extraction. Paper puts it on the server classpath anyway.
sqlite = { module = "org.xerial:sqlite-jdbc", version = "3.53.4.0" }

# Hooks. Never bundled: the server either has the plugin or the hook stays dormant.
auraskills = { module = "dev.aurelium:auraskills-api-bukkit", version = "2.3.12" }
bentobox = { module = "world.bentobox:bentobox", version = "3.22.3" }
blocklocker = { module = "nl.rutgerkok:blocklocker", version = "1.13" }
economyshopgui = { module = "com.github.Gypopo:EconomyShopGUI-API", version = "1.10.1" }
excellenteconomy = { module = "su.nightexpress.excellenteconomy:ExcellentEconomy", version = "2.8.0" }
factions = { module = "dev.kitteh:factions", version = "4.6.0" }
griefprevention = { module = "com.github.GriefPrevention:GriefPrevention", version = "18.0.0" }
iridiumskyblock = { module = "com.iridium:IridiumSkyblock", version = "4.1.4" }
lands = { module = "com.github.IncrediblePlugins:LandsAPI", version = "7.25.4" }
minecodes-plots = { module = "pl.minecodes.plots:plugin-api", version = "4.6.2" }
mmoitems = { module = "net.Indyuce:MMOItems-API", version = "6.10.1-SNAPSHOT" }
mythiclib = { module = "io.lumine:MythicLib-dist", version = "1.7.1-SNAPSHOT" }
mythicmobs = { module = "io.lumine:Mythic-Dist", version = "5.13.0" }
nightcore = { module = "su.nightexpress.nightcore:main", version = "2.16.4" }
plotsquared = { module = "com.intellectualsites.plotsquared:plotsquared-core", version = "7.6.0" }
redprotect-core = { module = "io.github.fabiozumbi12.RedProtect:RedProtect-Core", version.ref = "redprotect" }
redprotect-spigot = { module = "io.github.fabiozumbi12.RedProtect:RedProtect-Spigot", version.ref = "redprotect" }
residence = { module = "com.github.Zrips:Residence", version = "6.0.2.3" }
shopgui = { module = "com.github.brcdev-minecraft:shopgui-api", version = "3.2.0" }
simpleclaimsystem = { module = "com.github.Xyness:SimpleClaimSystem", version = "1.13.1" }
simpleclaimsystem-api = { module = "com.github.Xyness:SimpleClaimSystem-API", version = "v2.5.10" }
superiorskyblock = { module = "com.bgsoftware:SuperiorSkyblockAPI", version = "2026.2" }
towny = { module = "com.palmergames.bukkit.towny:towny", version = "0.103.0.7" }
vault = { module = "com.github.MilkBowl:VaultAPI", version = "1.7.1" }
worldguard = { module = "com.sk89q.worldguard:worldguard-bukkit", version = "7.1.0-SNAPSHOT" }
zmenu = { module = "fr.maxlego08.menu:zmenu-api", version = "1.1.1.8" }
zshop = { module = "fr.maxlego08.shop:zshop-api", version = "3.3.6" }

# Transitive libraries the hooks and paper-api each request at a different version. The root build
# script forces the whole bundle so compilation matches what the server runs. gson, guava, fastutil,
# log4j-api, slf4j-api and snakeyaml mirror paper-api exactly; the annotation-only artifacts just
# take the newest version anything asks for. After bumping paper-api, recheck against:
#   ./gradlew :core:dependencies --configuration compileClasspath
provided-annotations = { module = "org.jetbrains:annotations", version = "26.1.0" }
provided-checkerqual = { module = "org.checkerframework:checker-qual", version = "4.2.2" }
provided-errorprone = { module = "com.google.errorprone:error_prone_annotations", version = "2.50.0" }
provided-fastutil = { module = "it.unimi.dsi:fastutil", version = "8.5.19" }
provided-gson = { module = "com.google.code.gson:gson", version = "2.14.0" }
provided-guava = { module = "com.google.guava:guava", version = "33.3.1-jre" }
provided-jspecify = { module = "org.jspecify:jspecify", version = "1.0.1" }
provided-log4j = { module = "org.apache.logging.log4j:log4j-api", version = "2.26.1" }
provided-slf4j = { module = "org.slf4j:slf4j-api", version = "2.0.18" }
provided-snakeyaml = { module = "org.yaml:snakeyaml", version = "2.6" }

junit-bom = { module = "org.junit:junit-bom", version = "6.1.3" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[bundles]
serverProvided = [
    "provided-annotations",
    "provided-checkerqual",
    "provided-errorprone",
    "provided-fastutil",
    "provided-gson",
    "provided-guava",
    "provided-jspecify",
    "provided-log4j",
    "provided-slf4j",
    "provided-snakeyaml",
]
