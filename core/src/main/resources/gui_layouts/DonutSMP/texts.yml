# SmartSpawner DonutSMP layout texts
# Replaces these GUI texts from language/<locale>/gui.yml while this layout is active. Delete a key to use the language text.
# Colours: MiniMessage (<red>, <#5DB5F1>, <gradient:#5DB5F1:#FFFFFF>) or legacy (&c, &#5DB5F1).

main:
  title: '<#545454>{entity_small} <smallcaps>Spawner</smallcaps>'
  title_stacked: '<#545454>{amount} {entity_small} <smallcaps>Spawners</smallcaps>'
  storage:
    name: '<#f97603>sᴘᴀᴡɴᴇʀ sᴛᴏʀᴀɢᴇ'
    lore:
      - '{loot_items}'
    loot_items: '<#f97603>{amount} <white>{item_name}'
    loot_items_empty: '<#f97603>No items configured'
  info:
    name: '<#fce300>{stack_size} {entity_small} <smallcaps>Spawner</smallcaps>'
    lore:
      - '<#fce300>● <white>Click to sell items and collect xp'
      - '<#fce300>Storage:<white> {percent_storage_decimal}% <#fce300>Filled.'
      - '<#fce300>Exp:<white> {percent_exp_decimal}% <#fce300>Stored.'
    lore_no_shop:
      - '<#fce300>● <white>Click to collect xp'
      - '<#fce300>Storage:<white> {percent_storage_decimal}% <#fce300>Filled.'
      - '<#fce300>Exp:<white> {percent_exp_decimal}% <#fce300>Stored.'
    lore_full: ''
    lore_inactive: ''
    lore_no_loot: '<#ff3333><smallcaps>No loot configured</smallcaps>'
  exp:
    name: '<#7afc00><smallcaps>Collect exp</smallcaps>'
    lore:
      - '<#7afc00>{current_exp} <white>XP Points'

storage:
  title: '<#545454>{amount} {entity_small} <smallcaps>Spawners</smallcaps>'
  title_single: '<#545454>{amount} {entity_small} <smallcaps>Spawner</smallcaps>'
  previous_page:
    name: '<#7afc00><smallcaps>Previous</smallcaps>'
    lore:
      - '<white>Click to go back a page'
  next_page:
    name: '<#7afc00><smallcaps>Next</smallcaps>'
    lore:
      - '<white>Click to go forward a page'
  sell:
    name: '<#00f986><smallcaps>Sell all</smallcaps>'
    lore:
      - '<white>Click to sell all mob drops'
  sell_and_exp:
    name: '<green><smallcaps>Sell</smallcaps> & <smallcaps>Exp</smallcaps>'
    lore:
      - '<white>Click to sell items and collect experience'
  back:
    name: '<#fc0000><smallcaps>Return</smallcaps>'
    lore:
      - '<white>Click to return to the main menu'
  take_all:
    name: '<#fce300><smallcaps>Take all</smallcaps>'
    lore:
      - '<#fce300>● <white>Collect loot from the storage'
  drop_page:
    name: '<#00f986><smallcaps>Drop loot</smallcaps>'
    lore:
      - '<white>Click to drop all the loot on the page'

sell_confirm:
  title: '<#545454><smallcaps>Confirm sell</smallcaps>'
  cancel:
    name: '<#f50001><smallcaps>Cancel</smallcaps>'
    lore:
      - '<white>Click to cancel'
  confirm:
    name: '<#01ff00><smallcaps>Confirm</smallcaps>'
    lore:
      - '<white>Click to sell all items'
      - '<gray>(${total_sell_price})'
  confirm_with_exp:
    name: '<#01ff00><smallcaps>Confirm</smallcaps>'
    lore:
      - '<white>Click to sell all items and collect xp'
      - '<gray>(${total_sell_price} + {current_exp} xp)'
  summary:
    name: '<#02e57d><smallcaps>Loot</smallcaps>'
    lore:
      - '{loot_items}'
    loot_items: '<#02e57d>{amount} <white>{item_name}'
    loot_items_empty: '<#02e57d>No items to sell'
