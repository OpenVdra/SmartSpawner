# ──────────────────────────────────────────────────────
gui_title_filter_config: '    ᴄʜᴏ ᴘʜéᴘ           ʙị ᴄʜặɴ'

filter_divider:
  name: '<white>ᴛʜả <#5db5f1>ʟọᴄ'
