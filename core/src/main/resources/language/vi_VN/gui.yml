filter_item_allowed:
  name: '<white>{item_name}<#37eb9a> được phép'
  lore:
    - '<#37eb9a> ▸ <white>Nhấp để chặn vật phẩm này!'

filter_item_blocked:
  name: '<white>{item_name}<#ff6b6b> bị chặn'
