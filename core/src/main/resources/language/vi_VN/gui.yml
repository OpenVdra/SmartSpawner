    - '{available_items}'
    - ''
    - '<#5db5f1> ▸ Nhấp để sắp xếp!'
  selected_item: ' <#5db5f1>• {item_name}'
  unselected_item: ' <white>• {item_name}'
  no_item: ' <gray>• Không có'

drop_page_button:
  name: '<white>ᴛʜả <#ff6b6b>ᴛʀᴀɴɢ'
  lore:
    - ''
    - ' <#ff6b6b>⚠ ᴄảɴʜ ʙáᴏ:'
    - '  <dark_gray>• <white>Bạn sẽ thả mọi vật phẩm'
    - '   <white>từ trang này xuống đất.'
    - ''
    - '<#ff6b6b> ▸ Nhấp để thả!'

collect_exp_button:
  name: '<white>ɴʜậɴ <#5db5f1>ᴇxᴘ'
  lore:
    - ''
    - ' <#5db5f1>ℹ ᴛʜôɴɢ ᴛɪɴ:'
    - '  <dark_gray>• <white>Exp khả dụng: <green>{current_exp}'
    - ''
    - '<#5db5f1> ▸ Nhấp để nhận Exp!'

storage_spawner_info_button:
  name: ''
  lore:

