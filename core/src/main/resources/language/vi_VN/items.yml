# SmartSpawner – items.yml
# Spawner item display names and drop item names.

# Appearance of smart spawner items in inventory and tooltips
# Available placeholders: {entity}, {ᴇɴᴛɪᴛʏ}, {exp}, {loot_items}, {amount}, {item_name}, {chance}
smart_spawner:
  default:
    name: '<#5db5f1>Spawner {entity}'
    loot_items: '  <#ecf0f1> • {amount} {item_name} <#3498db>({chance}%)'
    loot_items_empty: '  <#ecf0f1> •  Không có'
    lore:
      - ''
      - ' <#5db5f1> ᴄʜɪ ᴛɪếᴛ:'
      - '  <#ecf0f1> • <white>Exp nhận: <green>{exp}'
      - ''
      - ' <#5db5f1> ᴠậᴛ ᴘʜẩᴍ ʀơɪ:'
      - '{loot_items}'
      - ''
  # Entity-specific sections override default per key. Unspecified keys use default.
  PIG:
    name: '<#ff77b7>Spawner {entity}'
    loot_items: '  <#fff0f7> • {amount} {item_name} <#ff8fc7>({chance}%)'
    loot_items_empty: '  <#fff0f7> •  Không có'
    lore:
      - ''
      - ' <#ff77b7> ᴄʜɪ ᴛɪếᴛ:'
      - '  <#fff0f7> • <white>Exp nhận: <#ff8fc7>{exp}'
      - ''
      - ' <#ff77b7> ᴠậᴛ ᴘʜẩᴍ ʀơɪ:'
      - '{loot_items}'
      - ''
  BLAZE:
    name: '<#ffb300>Spawner {entity}'
    loot_items: '  <#fff4cc> • {amount} {item_name} <#ffc107>({chance}%)'
    loot_items_empty: '  <#fff4cc> •  Không có'
    lore:
      - ''
      - ' <#ffb300> ᴄʜɪ ᴛɪếᴛ:'
      - '  <#fff4cc> • <white>Exp nhận: <#ffd54f>{exp}'
      - ''
      - ' <#ffb300> ᴠậᴛ ᴘʜẩᴍ ʀơɪ:'
      - '{loot_items}'
      - ''

