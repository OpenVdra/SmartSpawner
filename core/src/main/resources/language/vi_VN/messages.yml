# SmartSpawner messages
# Full guide: https://docs.smartspawner.site/docs/language
# Colours: MiniMessage (<red>, <#5DB5F1>, <gradient:#5DB5F1:#FFFFFF>) or legacy (&c, &#5DB5F1).
# Each message can use message, title, subtitle, action_bar and sound. enabled: false mutes it.

prefix: '<#3498db>SᴍᴀʀᴛSᴘᴀᴡɴᴇʀ <dark_gray>⏩ <reset>'

# {key}
missing_key:
  message: '<#ff4444>Thiếu khóa thông báo: <white>{key}'

general:
  inventory_full:
    message: '<#ff4444>Túi đồ của bạn đã đầy.'
  click_too_fast:
    message: '<#ff4444>Bạn đang nhấp quá nhanh.'
    sound: block.note_block.bass
  action_in_progress:
    message: '<#f0c857>Đã có một thao tác đang diễn ra. Vui lòng chờ.'
    action_bar: '<#f0c857>Đang thực hiện thao tác. Vui lòng chờ.'
  action_failed:
    message: '<#ff4444>Thao tác thất bại. Vui lòng thử lại.'
    action_bar: '<#ff4444>Thao tác thất bại. Vui lòng thử lại.'
  # {time}
  action_not_ready:
    message: '<#f0c857>Thao tác này chưa sẵn sàng. Vui lòng thử lại sau <white>{time}<#f0c857>.'
    sound: block.note_block.bass

spawner:
  activated:
    message: 'Spawner đã được<green> kích hoạt. <reset>Bây giờ bạn có thể nhận vật phẩm và Exp.'
    sound: block.beacon.activate
  # {entity}
  entity_changed:
    message: 'Spawner đã đổi thành <yellow>{entity}<white>.'
    action_bar: '<white>Spawner đã đổi thành <yellow>{entity}<white>.'
    sound: entity.player.levelup

storage:
  empty:
    message: '<#ff4444>Kho của spawner đang trống.'
  in_use:
    message: '<#ff4444>Kho của spawner này đang được mở bởi người chơi khác.'
    action_bar: '<#ff4444>Kho đang được sử dụng bởi người khác.'

# {exp} {exp_mending}
exp:
  none:
    message: '<#ff4444>Không có Exp để nhận'
  collected:
    message: 'Bạn đã nhận <green>{exp} <white>điểm kinh nghiệm.'
    action_bar: '<green>+{exp} Exp'
  collected_mending:
    message: 'Bạn đã nhận <green>{exp} <white>điểm kinh nghiệm. <red>{exp_mending} <white>đã được dùng để sửa đồ bằng Mending.'
    action_bar: '<green>+{exp} Exp <white>| <red>-{exp_mending} đã dùng cho Mending'

stack:
  different_type:
    message: '<#ff4444>Các spawner phải cùng loại để stack.'
    action_bar: '<#ff4444>Các spawner phải cùng loại.'
    sound: block.note_block.pling
  # {max}
  full:
    action_bar: '<#ff4444>Giới hạn stack tối đa: <white>{max}'
    sound: block.note_block.pling
  # {amount}
  success:
    action_bar: '<green>Bạn đã stack thành công <white>{amount} <green>spawner.'
    sound: entity.player.levelup

break:
  no_permission:
    message: '<#ff4444>Bạn không có quyền phá spawner này.'
    sound: entity.villager.no
  silk_touch_required:
    message: '<#ff4444>Bạn cần Silk Touch để phá spawner này.'
    action_bar: '<#ff4444>Bạn cần Silk Touch.'
    sound: item.shield.block
  wrong_tool:
    message: '<#ff4444>Bạn không thể phá spawner bằng công cụ này.'
    action_bar: '<#ff4444>Không thể phá spawner bằng công cụ này.'
    sound: item.shield.block
  no_drop:
    message: '<#ff4444>Lần này không may, spawner không rơi ra.'
    action_bar: '<#ff4444>Spawner không rơi ra.'
    sound: block.note_block.pling
  sneak_blocked:
    message: '<#ff4444>Bạn không thể phá cả stack khi spawner này có tỉ lệ rơi.'
    action_bar: '<#ff4444>Không thể phá cả stack.'
    sound: block.note_block.pling

# {amount} {price} {exp} {exp_mending}
sell:
  nothing_to_sell:
    message: '<#ff4444>Không tìm thấy vật phẩm có thể bán.'
  success:
    message: 'Bạn đã bán <yellow>{amount} <white>vật phẩm với giá <green>${price}<white>.'
    action_bar: '<green>+${price}'
  success_with_exp:
    message: 'Bạn đã bán <yellow>{amount} <white>vật phẩm với giá <green>${price}<white> và nhận <green>{exp} <white>Exp.'
    action_bar: '<green>+${price} <white>| <green>+{exp} Exp'
  success_with_exp_mending:
    message: 'Bạn đã bán <yellow>{amount} <white>vật phẩm với giá <green>${price}<white>, nhận <green>{exp} <white>Exp <white>(<red>{exp_mending} <white>đã dùng cho Mending).'
    action_bar: '<green>+${price} <white>| <green>+{exp} Exp <white>(<red>-{exp_mending} Mending)'

command:
  player_only:
    message: '<#ff4444>Lệnh này chỉ người chơi mới có thể sử dụng.'
    sound: block.note_block.bass
  no_permission:
    message: '<#ff4444>Bạn không có quyền thực hiện thao tác này.'
    sound: block.note_block.pling

  list:
    no_spawners_found:
      message: '<#ff4444>Không tìm thấy spawner nào.'
      sound: block.note_block.pling
    teleported_to_spawner:
      message: 'Bạn đã được dịch chuyển đến spawner.'
      sound: entity.enderman.teleport
    teleport_failed:
      message: '<#ff4444>Không thể dịch chuyển đến spawner.'
      sound: entity.enderman.teleport
    spawner_removed:
      message: '<white>Spawner đã được <#ff4444>gỡ bỏ <white>thành công.'
      sound: entity.item.break

  # {value} {max} {property} {old_value} {new_value} {world} {x} {y} {z}
  set:
    usage:
      message: 'Cách dùng: <#3498db>/ss set <stack_size|range|delay> \<value> [world x y z]'
      sound: block.note_block.hat
    invalid:
      message: '<#ff4444>Giá trị hoặc vị trí SmartSpawner không hợp lệ.'
      sound: block.note_block.pling
    stack_size_exceeds_max:
      message: '<#ff4444>Số lượng stack <white>{value} <#ff4444>vượt quá giới hạn stack của spawner này: <white>{max}'
      sound: block.note_block.pling
    location_required:
      message: '<#f0c857>Console phải cung cấp vị trí: <#3498db>/ss set <stack_size|range|delay> \<value> \<world> \<x> \<y> \<z>'
      sound: block.note_block.pling
    success:
      message: 'Đã đặt <green>{property} <white>từ <yellow>{old_value} <white>thành <green>{new_value} <white>tại <#3498db>{world} {x} {y} {z}<white>.'
      sound: entity.experience_orb.pickup

  # {percent} {count} {radius}
  near:
    bossbar:
      analyzing: 'Đang quét các spawner gần đây... {percent}%'
      found: 'Đã tìm thấy {count} spawner trong phạm vi {radius} khối.'
      not_found: 'Không tìm thấy spawner trong phạm vi {radius} khối.'
    view_gui:
      button: ' [Xem trong GUI]'
      hover: 'Nhấp để xem {count} spawner tìm thấy gần đây.'
    scan_start:
      message: 'Đang quét spawner trong phạm vi <yellow>{radius} <white>khối...'
      sound: block.note_block.hat
    scan_found:
      message: 'Đã tìm thấy <green>{count} <white>spawner trong phạm vi <yellow>{radius} <white>khối. Đánh dấu kéo dài <yellow>30s<white>.'
      sound: entity.experience_orb.pickup
    scan_none:
      message: '<#ff4444>Không tìm thấy spawner trong phạm vi <white>{radius} <#ff4444>khối.'
      sound: block.note_block.pling
    scan_cancelled:
      message: '<#f0c857>Đã hủy quét và xóa đánh dấu.'
      sound: block.note_block.bass
    no_active_scan:
      message: '<#ff4444>Bạn không có lượt quét đang hoạt động để hủy.'
      sound: block.note_block.bass
    highlights_expired:
      message: '<#888888>Đánh dấu spawner đã hết hạn.'

  # {amount} {entity} {player}
  give:
    player_not_found:
      message: '<#ff4444>Không tìm thấy người chơi.'
      sound: block.note_block.pling
    invalid_mob_type:
      message: '<#ff4444>Loại sinh vật hoặc tên spawner không hợp lệ.'
      sound: block.note_block.pling
    invalid_item_type:
      message: '<#ff4444>Loại vật phẩm không hợp lệ.'
      sound: block.note_block.pling
    invalid_item_spawner:
      message: '<#ff4444>Tên Item Spawner không hợp lệ.'
      sound: block.note_block.pling
    inventory_full:
      message: '<#ff4444>Một số spawner đã rơi ra vì túi đồ đã đầy.'
      sound: block.note_block.pling
    spawner_received:
      message: 'Bạn đã nhận <green>{amount} <white>spawner {entity}.'
      sound: entity.experience_orb.pickup
    spawner_given:
      message: 'Đã trao <green>{amount} <white>spawner {entity} cho <#3498db>{player}<white>.'
      sound: entity.experience_orb.pickup

  hologram:
    enabled:
      message: 'Hologram đã được <green>bật <white>cho tất cả spawner.'
      sound: entity.experience_orb.pickup
    disabled:
      message: 'Hologram đã được <#ff4444>tắt <white>cho tất cả spawner.'
      sound: block.note_block.bass
    cleared:
      message: 'Đã xóa thành công <green>tất cả hologram<white>.'
      sound: entity.experience_orb.pickup
    clear_error:
      message: '<#ff4444>Không thể xóa hologram.'
      sound: block.note_block.pling

  # {count}
  clear:
    usage:
      message: 'Cách dùng: <#3498db>/ss clear <holograms|ghost_spawners>'
      sound: block.note_block.hat
    ghost_check_start:
      message: 'Đang kiểm tra spawner ảo...'
      sound: block.note_block.hat
    ghost_cleared:
      message: 'Đã gỡ thành công <green>{count} <white>spawner ảo.'
      sound: entity.experience_orb.pickup
    ghost_none_found:
      message: '<#ff4444>Không tìm thấy spawner ảo.'
      sound: entity.experience_orb.pickup

  prices:
    not_available:
      message: '<#ff4444>Tích hợp bán chưa khả dụng. Vui lòng cấu hình kinh tế.'
      sound: block.note_block.pling
    no_priceable_items:
      message: '<#ff4444>Không tìm thấy vật phẩm có giá.'
      sound: block.note_block.pling

  reload:
    start:
      message: '<#f0c857>Đang tải lại plugin... Vui lòng chờ.'
    success:
      message: 'Đã tải lại thành công <#3498db>SmartSpawner<white>.'
      sound: entity.experience_orb.pickup
    error:
      message: '<#ff4444>Không thể tải lại SmartSpawner. Vui lòng kiểm tra console để biết chi tiết.'
      sound: block.note_block.pling

  # {current} {available} {value} {old_value} {new_value}
  language:
    current:
      message: 'Ngôn ngữ hiện tại: <green>{current} <#888888>| <white>Khả dụng: {available}'
      sound: block.note_block.hat
    invalid:
      message: '<#ff4444>Ngôn ngữ không xác định: <white>{value}<#ff4444>. Thử: <white>{available}'
      sound: block.note_block.pling
    already_set:
      message: '<#f0c857>Ngôn ngữ đã được đặt thành <white>{value}<#f0c857>.'
      sound: block.note_block.hat
    success:
      message: 'Đã đổi ngôn ngữ từ <yellow>{old_value} <white>sang <green>{new_value}<white>.'
      sound: entity.experience_orb.pickup
    error:
      message: '<#ff4444>Không thể đổi ngôn ngữ. Vui lòng kiểm tra console.'
      sound: block.note_block.pling

  # {current} {available} {value} {old_value} {new_value}
  gui_layout:
    current:
      message: 'Bố cục hiện tại: <green>{current} <#888888>| <white>Khả dụng: {available}'
      sound: block.note_block.hat
    invalid:
      message: '<#ff4444>Bố cục GUI không xác định: <white>{value}<#ff4444>. Thử: <white>{available}'
      sound: block.note_block.pling
    already_set:
      message: '<#f0c857>Bố cục GUI đã được đặt thành <white>{value}<#f0c857>.'
      sound: block.note_block.hat
    success:
      message: 'Đã đổi bố cục GUI từ <yellow>{old_value} <white>sang <green>{new_value}<white>.'
      sound: entity.experience_orb.pickup
    error:
      message: '<#ff4444>Không thể đổi bố cục GUI. Vui lòng kiểm tra console.'
      sound: block.note_block.pling

  # {name} {label}
  editloot:
    usage:
      message: 'Cách dùng: <#37eb9a>/ss editloot <tên spawner><white>. Ví dụ: <#37eb9a>/ss editloot blaze_spawner'
      sound: block.note_block.hat
    unknown_entry:
      message: '<#ff4444>Không có spawner tên <white>{name}<#ff4444>. Dùng tab để xem các tên hợp lệ.'
      sound: block.note_block.bass
    entry_missing:
      message: '<#ff4444>Mục này không còn trong file nữa.'
      sound: block.note_block.bass
    loot_added:
      message: '<#37eb9a>Đã thêm loot <white>{label}<#37eb9a>.'
      sound: entity.experience_orb.pickup
    loot_saved:
      message: '<#37eb9a>Đã lưu loot <white>{label}<#37eb9a>.'
      sound: entity.experience_orb.pickup
    loot_replaced:
      message: '<#37eb9a>Đã đổi vật phẩm cho <white>{label}<#37eb9a>.'
      sound: entity.experience_orb.pickup
    loot_deleted:
      message: '<#ff6b6b>Đã xóa loot <white>{label}<#ff6b6b>.'
      sound: entity.item.pickup
    capture_empty:
      message: '<#ff4444>Hãy đặt một vật phẩm vào ô giữa trước.'
      sound: block.note_block.bass
