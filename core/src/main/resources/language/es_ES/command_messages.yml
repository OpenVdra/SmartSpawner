# SmartSpawner – command_messages.yml
# Messages related to plugin commands, including usage instructions and command errors.

# ──────────────────────────────────────────────────────
#                        General
# ──────────────────────────────────────────────────────
player_only:
  message: "<#ff4444>Este comando solo puede ser utilizado por jugadores."
  sound: block.note_block.bass

no_permission:
  message: "<#ff4444>No tienes permiso para hacer eso."
  sound: block.note_block.pling

# ──────────────────────────────────────────────────────
#                     /ss list
# ──────────────────────────────────────────────────────
list:
  no_spawners_found:
    message: '<#ff4444>no se han encontrado generadores.'
    sound: block.note_block.pling
  teleported_to_spawner:
    message: 'Has sido teletransportado al generador.'
    sound: entity.enderman.teleport
  teleport_failed:
    message: '<#ff4444>No ha sido posible teletransportarte al generador.'
    sound: entity.enderman.teleport
  spawner_removed:
    message: '<white>El generador ha sido <#ff4444>eliminado <white>correctamente.'
    sound: entity.item.break

# ──────────────────────────────────────────────────────
#                        /ss set
# ──────────────────────────────────────────────────────
set:
  usage:
    message: "Uso: <#3498db>/ss set <tamaño_stack|rango|intervalo> <valor> [mundo x y z]"
    sound: block.note_block.hat
  invalid:
    message: "<#ff4444>Valor o ubicación de generador no válidos."
    sound: block.note_block.pling
  stack_size_exceeds_max:
    message: "<#ff4444>El tamaño del acumulado <white>{value} <#ff4444>supera el tamaño máximo de este generador: <white>{max}"
    sound: block.note_block.pling
  location_required:
    message: "<#f0c857>La consola debe especificar una ubicación: <#3498db>/ss set <tamaño_stack|rango|intervalo> <valor> <mundo> \\<x> \\<y> \\<z>"
    sound: block.note_block.pling
  success:
    message: "Se ha cambiado <green>{property} <white>de <yellow>{old_value} <white>a <green>{new_value} <white>en <#3498db>{world} {x} {y} {z}<white>."
    sound: entity.experience_orb.pickup

# ──────────────────────────────────────────────────────
#                        /ss near
# ──────────────────────────────────────────────────────
near:
  bossbar:
    analyzing: "Escaneando generadores cercanos... {percent}%"
    found: "Se han encontrado {count} generador(es) a menos de {radius} bloques."
    not_found: "No se han encontrado generadores a menos de {radius} bloques."
  view_gui:
    button: " [Ver en interfaz]"
    hover: "Haz clic para examinar el/los {count} generador(es) encontrado(s) cerca."
  scan_start:
    message: "Escaneando generadores a menos de <yellow>{radius} <white>bloques..."
    sound: block.note_block.hat
  scan_found:
    message: "Se han encontrado <green>{count} <white>generador(es) a menos de <yellow>{radius} <white>bloques. El resaltado dura <yellow>30s<white>."
    sound: entity.experience_orb.pickup
  scan_none:
    message: "<#ff4444>No se han encontrado generadores a menos de <white>{radius} <#ff4444>bloques."
    sound: block.note_block.pling
  scan_cancelled:
    message: "<#f0c857>Escaneo cancelado y resaltados eliminados."
    sound: block.note_block.bass
  no_active_scan:
    message: "<#ff4444>No tienes ningún escaneo activo para cancelar."
    sound: block.note_block.bass
  highlights_expired:
    message: "<#888888>El resaltado de los generadores ha expirado."

# ──────────────────────────────────────────────────────
#                        /ss give
# ──────────────────────────────────────────────────────
give:
  player_not_found:
    message: "<#ff4444>Jugador no encontrado."
    sound: block.note_block.pling
  invalid_mob_type:
    message: "<#ff4444>Tipo de criatura o nombre de spawner no válido."
    sound: block.note_block.pling
  invalid_item_type:
    message: "<#ff4444>Tipo de objeto no válido."
    sound: block.note_block.pling
  invalid_item_spawner:
    message: "<#ff4444>Nombre de generador de objetos no válido."
    sound: block.note_block.pling
  inventory_full:
    message: "<#ff4444>Se han soltado algunos generadores al suelo porque el inventario está lleno."
    sound: block.note_block.pling
  spawner_received:
    message: "Has recibido <green>{amount} <white>generador(es) de <green>{entity}<white>."
    sound: entity.experience_orb.pickup
  spawner_given:
    message: "Has dado <green>{amount} <white>generador(es) de <green>{entity} <white>a <#3498db>{player}<white>."
    sound: entity.experience_orb.pickup

# ──────────────────────────────────────────────────────
#                      /ss hologram
# ──────────────────────────────────────────────────────
hologram:
  enabled:
    message: "Los hologramas están <green>activados <white>para todos los generadores."
    sound: entity.experience_orb.pickup
  disabled:
    message: "Los hologramas están <#ff4444>desactivados <white>para todos los generadores."
    sound: block.note_block.bass
  cleared:
    message: "Se han eliminado con éxito <green>todos los hologramas<white>."
    sound: entity.experience_orb.pickup
  clear_error:
    message: "<#ff4444>No se han podido eliminar los hologramas."
    sound: block.note_block.pling

# ──────────────────────────────────────────────────────
#                       /ss clear
# ──────────────────────────────────────────────────────
clear:
  usage:
    message: "Uso: <#3498db>/ss clear <hologramas|generadores_fantasma>"
    sound: block.note_block.hat
  ghost_check_start:
    message: "Comprobando si hay generadores fantasma..."
    sound: block.note_block.hat
  ghost_cleared:
    message: "Se han eliminado con éxito <green>{count} <white>generador(es) fantasma."
    sound: entity.experience_orb.pickup
  ghost_none_found:
    message: "<#ff4444>No se han encontrado generadores fantasma."
    sound: entity.experience_orb.pickup

# ──────────────────────────────────────────────────────
#                       /ss prices
# ──────────────────────────────────────────────────────
prices:
  not_available:
    message: "<#ff4444>La integración de venta no está disponible. Por favor, configura la economía."
    sound: block.note_block.pling
  no_priceable_items:
    message: "<#ff4444>No se han encontrado objetos con precio."
    sound: block.note_block.pling

# ──────────────────────────────────────────────────────
#                      /ss reload
# ──────────────────────────────────────────────────────
reload:
  start:
    message: "<#f0c857>Recargando el plugin... Por favor, espera."
  success:
    message: "Se ha recargado con éxito <#3498db>SmartSpawner<white>."
    sound: entity.experience_orb.pickup
  error:
    message: "<#ff4444>Error al recargar SmartSpawner. Por favor, revisa la consola para más detalles."
    sound: block.note_block.pling

# ──────────────────────────────────────────────────────
#                      /ss language
# ──────────────────────────────────────────────────────
language:
  current:
    message: "Idioma actual: <green>{current} <#888888>| <white>Disponibles: {available}"
    sound: block.note_block.hat
  invalid:
    message: "<#ff4444>Idioma desconocido: <white>{value}<#ff4444>. Prueba con: <white>{available}"
    sound: block.note_block.pling
  already_set:
    message: "<#f0c857>El idioma ya está configurado en <white>{value}<#f0c857>."
    sound: block.note_block.hat
  success:
    message: "Se ha cambiado el idioma de <yellow>{old_value} <white>a <green>{new_value}<white>."
    sound: entity.experience_orb.pickup
  error:
    message: "<#ff4444>Error al cambiar el idioma. Por favor, revisa la consola."
    sound: block.note_block.pling

# ──────────────────────────────────────────────────────
#                     /ss gui_layout
# ──────────────────────────────────────────────────────
gui_layout:
  current:
    message: "Diseño de interfaz actual: <green>{current} <#888888>| <white>Disponibles: {available}"
    sound: block.note_block.hat
  invalid:
    message: "<#ff4444>Diseño de interfaz desconocido: <white>{value}<#ff4444>. Prueba con: <white>{available}"
    sound: block.note_block.pling
  already_set:
    message: "<#f0c857>El diseño de interfaz ya está configurado en <white>{value}<#f0c857>."
    sound: block.note_block.hat
  success:
    message: "Se ha cambiado el diseño de interfaz de <yellow>{old_value} <white>a <green>{new_value}<white>."
    sound: entity.experience_orb.pickup
  error:
    message: "<#ff4444>Error al cambiar el diseño de interfaz. Por favor, revisa la consola."
    sound: block.note_block.pling

# ──────────────────────────────────────────────────────
#                     /ss editloot
# ──────────────────────────────────────────────────────
editloot:
  usage:
    message: "Uso: <#37eb9a>/ss editloot <nombre_del_generador><white>. Ejemplo: <#37eb9a>/ss editloot blaze_spawner"
    sound: block.note_block.hat
  unknown_entry:
    message: "<#ff4444>No hay ningún generador llamado <white>{name}<#ff4444>. Usa el tabulador para ver los nombres válidos."
    sound: block.note_block.bass
  entry_missing:
    message: "<#ff4444>Esa entrada ya no está en el archivo."
    sound: block.note_block.bass
  loot_added:
    message: "<#37eb9a>Se ha añadido la entrada de botín <white>{label}<#37eb9a>."
    sound: entity.experience_orb.pickup
  loot_saved:
    message: "<#37eb9a>Se ha guardado la entrada de botín <white>{label}<#37eb9a>."
    sound: entity.experience_orb.pickup
  loot_replaced:
    message: "<#37eb9a>Se ha actualizado el objeto para <white>{label}<#37eb9a>."
    sound: entity.experience_orb.pickup
  loot_deleted:
    message: "<#ff6b6b>Se ha eliminado la entrada de botín <white>{label}<#ff6b6b>."
    sound: entity.item.pickup
  capture_empty:
    message: "<#ff4444>Pon primero un objeto en la ranura central."
    sound: block.note_block.bass
