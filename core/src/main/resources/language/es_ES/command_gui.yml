# ──────────────────────────────────────────────────────
#              Loot Editor (/ss editloot)
# ──────────────────────────────────────────────────────
editloot:
  mob_loot_title: 'ʙᴏᴛíɴ • {entry}'
  item_loot_title: 'ᴏʙᴊᴇᴛᴏs • {entry}'
  capture_add_title: 'sᴜᴇʟᴛᴀ ᴜɴ ᴏʙᴊᴇᴛᴏ ᴘᴀʀᴀ ᴀñᴀᴅɪʀ'
  capture_replace_title: 'sᴜᴇʟᴛᴀ ᴜɴ ɴᴜᴇᴠᴏ ᴏʙᴊᴇᴛᴏ'

  loot_entry:
    name: '<white>ʙᴏᴛíɴ <#37eb9a>{label}'
    lore:
      - ''
      - ' <#37eb9a>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
      - '  <dark_gray>• <white>Objeto: <yellow>{item}'
      - '  <dark_gray>• <white>Cantidad: <yellow>{amount}'
      - '  <dark_gray>• <white>Probabilidad: <yellow>{chance}%'
      - '  <dark_gray>• <white>Durabilidad: <yellow>{durability}'
      - ''
      - '<#37eb9a> ▸ <white>¡Clic izquierdo para modificar los valores!'
      - '<#37eb9a> ▸ <white>¡Clic derecho para modificar los objetos!'

  loot_broken:
    name: '<white>ʙᴏᴛíɴ <#ff6b6b>{label}'
    lore:
      - ''
      - ' <#ff6b6b>⚠ ᴀᴅᴠᴇʀᴛᴇɴᴄɪᴀ:'
      - '  <dark_gray>• <white>Este objeto no se puede leer.'
      - '  <dark_gray>• <white>Valor: <yellow>{item}'
      - ''
      - '<#ff6b6b> ▸ <white>¡Clic derecho para establecer un nuevo objeto!'

  add_loot:
    name: '<white>ᴀñᴀᴅɪʀ <#37eb9a>ʙᴏᴛíɴ'
    lore:
      - ''
      - ' <#37eb9a>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
      - '  <dark_gray>• <white>Añade otro objeto de botín.'
      - ''
      - '<#37eb9a> ▸ <white>¡Clic para elegir un objeto!'

  capture_hint:
    name: '<white>sᴏʟᴛᴀʀ ᴜɴ ᴏʙᴊᴇᴛᴏ <#5db5f1>ᴇɴ ᴇʟ ᴍᴇᴅɪᴏ'
    lore:
      - ''
      - ' <#5db5f1>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
      - '  <dark_gray>• <white>El objeto se guardará tal cual.'
      - '  <dark_gray>• <white>Se te devolverá cuando te vayas.'

  cancel:
    name: '<white>ᴄᴀɴᴄᴇʟᴀʀ <#ff6b6b>ᴄᴀᴘᴛᴜʀᴀ'
    lore:
      - ''
      - ' <#ff6b6b>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
      - '  <dark_gray>• <white>Desechar esta captura.'
      - ''
      - '<#ff6b6b> ▸ <white>¡Clic para cancelar!'

  confirm:
    name: '<white>ᴄᴏɴғɪʀᴍᴀʀ <#37eb9a>ᴏʙᴊᴇᴛᴏ'
    lore:
      - ''
      - ' <#37eb9a>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
      - '  <dark_gray>• <white>Continúa estableciendo la cantidad y probabilidad.'
      - ''
      - '<#37eb9a> ▸ <white>¡Clic para continuar!'

  # Dialog text. Rendered inside the client dialog, so keep it short.
  dialog_title:
    name: 'ᴄᴏɴғɪɢᴜʀᴀᴄɪóɴ ᴅᴇ ʙᴏᴛíɴ'
  dialog_body:
    name: '<gray>La cantidad y durabilidad aceptan un rango entr <white>0 y 2<gray>.'
  dialog_save:
    name: '<green>✔ <white>Guardar'
  dialog_cancel:
    name: '<red>← <white>Cancelar'
  dialog_delete:
    name: '<dark_red>✖ <white>Eliminar botín'
  field_amount:
    name: 'Cantidad (ej. 1 or 0-2)'
  field_chance:
    name: 'Probabilidad % (0-100)'
  field_durability:
    name: 'Durabilidad (vacío para ninguno, ej. 1-384)'
  error_amount:
    name: '<red>La cantidad debe ser un número entero entre 0 y {max}, y el mínimo no puede superar al máximo.'
  error_chance:
    name: '<red>La probabilidad debe ser un número del 0 al 100.'
  error_durability:
    name: '<red>La durabilidad debe ser un número entero, y el mínimo no puede superar al máximo.'
