# SmartSpawner GUI text
# Full guide: https://docs.smartspawner.site/docs/language
# Colours: MiniMessage (<red>, <#5DB5F1>, <gradient:#5DB5F1:#FFFFFF>) or legacy (&c, &#5DB5F1).

main:
  # {amount} {entity} {entity_small}
  title: '<smallcaps>Generador de</smallcaps> {entity_small}'
  title_stacked: '{amount} {entity_small} ɢᴇɴᴇʀᴀᴅᴏʀᴇs'

  # {current_items} {max_slots} {percent_storage_rounded} {total_sell_price} {loot_items} {entity} {entity_small}
  storage:
    name: '<white><smallcaps>Abrir</smallcaps> <#5db5f1><smallcaps>Almacenamiento</smallcaps>'
    lore:
      - ''
      - ' <#5db5f1>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
      - '  <dark_gray>• <white>Aquí puedes ver y gestionar'
      - '   <white> todos los objetos almacenados'
      - '   <white> en este generador.'
      - ''
      - ' <#5db5f1>★ <smallcaps>Capacidad</smallcaps>: <white>{percent_storage_rounded}%'
      - '{loot_items}'
      - ''
      - '<#5db5f1> ▸ ¡Clic para abrir el almacenamiento!'
    # One line of {loot_items}: {item_name} {amount} {raw_amount} {chance}
    loot_items: '  <dark_gray>• <white>{item_name}<white>: <yellow>{amount}'
    loot_items_empty: '  <dark_gray>• <white>No hay objetos guardados'

  # {entity} {entity_small} {stack_size} {range} {delay} {min_mobs} {max_mobs} {current_items} {max_items} {percent_storage_rounded} {percent_storage_decimal} {current_exp} {max_exp} {raw_current_exp} {raw_max_exp} {percent_exp_rounded} {percent_exp_decimal} {time} {total_sell_price}
  info:
    name: '<#5db5f1>ɪɴғᴏʀᴍᴀᴄɪóɴ <white><smallcaps>Del generador</smallcaps>'
    lore:
      - ''
      - ' <#5db5f1>ℹ ᴇsᴛᴀᴅísᴛɪᴄᴀs:'
      - '   <dark_gray>• <white>Acumulado: <yellow>{stack_size}'
      - '   <dark_gray>• <white>Rango: <yellow>{range} <white>bloques'
      - '   <dark_gray>• <white>Criaturas: <yellow>{min_mobs}<white>-<yellow>{max_mobs}'
      - '   <dark_gray>• <white>Intervalo: <yellow>{delay} <white>segundos'
      - ''
      - ' <#5db5f1>★ sɪɢᴜɪᴇɴᴛᴇ ɢᴇɴᴇʀᴀᴄɪóɴ: <white>{time}'
      - '   <dark_gray>• <white>Experiencia: <yellow>{percent_exp_rounded}%'
      - '   <dark_gray>• <white>Almacenamiento: <yellow>{percent_storage_rounded}%'
      - '   <dark_gray>• <white>Valor de venta: <green>${total_sell_price}'
      - ''
      - '<#5db5f1> ▸ Clic izquierdo: <white>Vender y recoger experiencia'
    # Used when the player cannot sell.
    lore_no_shop:
      - ''
      - ' <#5db5f1>ℹ ᴇsᴛᴀᴅísᴛɪᴄᴀs:'
      - '   <dark_gray>• <white>Acumulado: <yellow>{stack_size}'
      - '   <dark_gray>• <white>Rango: <yellow>{range} <white>bloques'
      - '   <dark_gray>• <white>Criaturas: <yellow>{min_mobs}<white>-<yellow>{max_mobs}'
      - '   <dark_gray>• <white>Intervalo: <yellow>{delay} <white>segundos'
      - ''
      - ' <#5db5f1>★ sɪɢᴜɪᴇɴᴛᴇ ɢᴇɴᴇʀᴀᴄɪóɴ: <white>{time}'
      - '   <dark_gray>• <white>Experiencia: <yellow>{percent_exp_rounded}%'
      - '   <dark_gray>• <white>Almacenamiento: <yellow>{percent_storage_rounded}%'
      - ''
    # Shown as {time} when the spawner is not counting down.
    lore_full: '<#ff4444><smallcaps>Capacidad completa</smallcaps>'
    lore_inactive: '<#ff4444><smallcaps>Inactivo</smallcaps>'
    lore_no_loot: '<#ff4444>sɪɴ ʀᴇᴄᴏᴍᴘᴇɴsᴀs ᴄᴏɴғɪɢᴜʀᴀᴅᴀs'

  # {current_exp} {max_exp} {percent_exp_rounded} {percent_exp_decimal}
  exp:
    name: '<white><smallcaps>Recoger</smallcaps> <#5db5f1><smallcaps>Experiencia</smallcaps>'
    lore:
      - ''
      - ' <#5db5f1>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
      - '  <dark_gray>• <white>Recoge experiencia o úsala'
      - '   <white> para reparar tu equipo'
      - '   <white> con reparación.'
      - ''
      - ' <#5db5f1>★ <smallcaps>Capacidad</smallcaps>: <white>{percent_exp_rounded}%'
      - '  <dark_gray>• <white>Experiencia almacenada: <green>{current_exp}<white>/<green>{max_exp}'
      - ''
      - '<#5db5f1> ▸ ¡Haz clic para recoger la experiencia!'

storage:
  # {current_page} {total_pages} {amount} {entity} {entity_small}
  title: '[{current_page}/{total_pages}] <smallcaps>Almacenamiento</smallcaps>'
  # Used instead of title for a spawner that is not stacked.
  title_single: '[{current_page}/{total_pages}] <smallcaps>Almacenamiento</smallcaps>'

  # {target_page}
  previous_page:
    name: '<#37eb9a>ᴘáɢɪɴᴀ ᴀɴᴛᴇʀɪᴏʀ'
    lore:
      - '<#2cc483> ▸ <#f8f8ff>Clic para ir a la página <#37eb9a>{target_page}'
  next_page:
    name: '<#37eb9a>sɪɢᴜɪᴇɴᴛᴇ ᴘáɢɪɴᴀ'
    lore:
      - '<#2cc483> ▸ <#f8f8ff>Clic para ir a la página <#37eb9a>{target_page}'

  # {total_sell_price}
  sell:
    name: '<white><smallcaps>Vender</smallcaps> <green>ᴏʙᴊᴇᴛᴏs'
    lore:
      - ''
      - ' <green>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
      - '  <dark_gray>• <white>Vas a vender todos los'
      - '   <white> objetos de tu almacenamiento.'
      - ''
      - '<green> ▸ ¡Clic para vender!'
  sell_and_exp:
    name: '<white><smallcaps>Vender y</smallcaps> <green><smallcaps>Recoger experiencia</smallcaps>'
    lore:
      - ''
      - ' <green>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
      - '  <dark_gray>• <white>Vas a vender todos los'
      - '   <white> objetos y recoger toda la experiencia acumulada'
      - '  <dark_gray>• <white>Total estimado: <green>${total_sell_price}'
      - ''
      - '<green> ▸ ¡Clic para continuar!'

  back:
    name: '<white><smallcaps>Volver al</smallcaps> <#ff6b6b>ᴍᴇɴú ᴘʀɪɴᴄɪᴘᴀʟ'
    lore:
      - ''
      - ' <#dadada>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
      - '  <dark_gray>• <white>Clic para volver'
      - '   <white>al menú anterior.'
      - ''
      - '<red> ▸ ¡Clic para volver atrás!'

  take_all:
    name: '<white><smallcaps>Recoger</smallcaps> <#5db5f1><smallcaps>Todo</smallcaps>'
    lore:
      - ''
      - ' <#5db5f1>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
      - '  <dark_gray>• <white>Vas a recoger todos los'
      - '   <white> objetos de esta página.'
      - ''
      - '<#5db5f1> ▸ ¡Clic para recoger!'

  filter:
    name: '<white>ғɪʟᴛʀᴀʀ <#5db5f1>ʙᴏᴛíɴ'
    lore:
      - ''
      - ' <#5db5f1>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
      - '  <dark_gray>• <white>Configura los objetos permitidos'
      - '   <white>y bloqueados para este generador.'
      - ''
      - '<#5db5f1> ▸ ¡Haz clic para configurar los filtros!'

  # {available_items} is the list built from selected_item, unselected_item and no_item ({item_name}).
  sort:
    name: '<white><smallcaps>Ordenar</smallcaps> <#5db5f1>ʙᴏᴛíɴ'
    lore:
      - ''
      - '{available_items}'
      - ''
      - '<#5db5f1> ▸ ¡Clic para ordenar!'
    selected_item: ' <#5db5f1>• {item_name}'
    unselected_item: ' <white>• {item_name}'
    no_item: ' <gray>• Ninguno'

  drop_page:
    name: '<white><smallcaps>Tirar</smallcaps> <#ff6b6b>ᴘáɢɪɴᴀ'
    lore:
      - ''
      - ' <#ff6b6b>⚠ <smallcaps>Advertencia</smallcaps>:'
      - '  <dark_gray>• <white>Vas a tirar todos los'
      - '   <white> objetos de esta página al suelo.'
      - ''
      - '<#ff6b6b> ▸ ¡Clic para tirar!'

  # {current_exp}
  collect_exp:
    name: '<white><smallcaps>Recoger</smallcaps> <#5db5f1><smallcaps>Experiencia</smallcaps>'
    lore:
      - ''
      - ' <#5db5f1>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
      - '  <dark_gray>• <white>Experiencia disponible: <green>{current_exp}'
      - ''
      - '<#5db5f1> ▸ ¡Clic para recoger!'

  # Empty unless a layout places the info button in the storage. Same placeholders as main.storage.
  info:
    name: ''
    lore:

# {total_sell_price} {current_exp}
sell_confirm:
  title: 'ᴄᴏɴғɪʀᴍᴀʀ ᴠᴇɴᴛᴀ'

  cancel:
    name: '<white><smallcaps>Cancelar</smallcaps> <#ff6b6b><smallcaps>Venta</smallcaps>'
    lore:
      - ''
      - ' <#ff6b6b>⚠ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
      - '  <dark_gray>• <white>Haz clic para volver'
      - '   <white> sin vender nada.'
      - ''
      - '<#ff6b6b> ▸ ¡Haz clic para cancelar!'

  confirm:
    name: '<white>ᴄᴏɴғɪʀᴍᴀʀ <#5db5f1><smallcaps>Venta</smallcaps>'
    lore:
      - ''
      - ' <#5db5f1>ℹ Recibirás:'
      - '  <dark_gray>• <white>Dinero: <green>${total_sell_price}'
      - ''
      - '<#5db5f1> ▸ ¡Haz clic para confirmar la venta!'

  confirm_with_exp:
    name: '<white>ᴄᴏɴғɪʀᴍᴀʀ ᴠᴇɴᴛᴀ <#5db5f1><smallcaps>Y experiencia</smallcaps>'
    lore:
      - ''
      - ' <#5db5f1>ℹ Recibirás:'
      - '  <dark_gray>• <white>Dinero: <green>${total_sell_price}'
      - '  <dark_gray>• <white>Experiencia: <green>{current_exp}'
      - ''
      - '<#5db5f1> ▸ ¡Haz clic para confirmar!'

  # {entity} {entity_small} {current_items} {max_items} {current_exp} {total_sell_price} {percent_storage_decimal} {percent_storage_rounded} {loot_items}
  summary:
    name: ' <#5db5f1>ʀᴇsᴜᴍᴇɴ <white><smallcaps>De venta</smallcaps>'
    lore:
      - ''
      - ' <#5db5f1>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
      - '{loot_items}'
      - '  <dark_gray>• <green>+ <white>Experiencia: <yellow>{current_exp}'
      - '  <dark_gray>• <green>+ <white>Dinero: <green>${total_sell_price}'
    # One line of {loot_items}: {amount} {item_name} {chance}
    loot_items: '  <dark_gray>• <#ff6b6b>- <white>{item_name}<white>: <yellow>{amount}'
    loot_items_empty: '  <dark_gray>• <#ff6b6b>- <white>No hay objetos para vender'

filter:
  title: ' <smallcaps>Permitido            bloqueado</smallcaps>'

  divider:
    name: '<#5db5f1>ғɪʟᴛʀᴏ <white>ᴅᴇ ʙᴏᴛíɴ'
    lore:
      - ''
      - ' <#5db5f1>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
      - '  <dark_gray>• <white>Lado izquierdo: objetos permitidos'
      - '  <dark_gray>• <white>Lado derecho: objetos bloqueados'
      - ''
      - '<#5db5f1> ▸ ¡Clic para volver al almacenamiento!'

  # {item_name}
  allowed:
    name: '<white>{item_name}<#37eb9a> permitido'
    lore:
      - '<#37eb9a> ▸ <white>¡Clic para bloquear este objeto!'
  blocked:
    name: '<white>{item_name}<#ff6b6b> bloqueado'
    lore:
      - '<#ff6b6b> ▸ <white>¡Clic para permitir este objeto!'

# The GUIs opened by commands: /ss list, /ss near, /ss prices and /ss editloot.
command:
  # {target_page} {previous_menu}
  navigation:
    previous_page:
      name: '<#37eb9a>ᴘáɢɪɴᴀ ᴀɴᴛᴇʀɪᴏʀ'
      lore:
        - '<#2cc483> ▸ <#f8f8ff>Clic para ir a la página <#37eb9a>{target_page}'
    next_page:
      name: '<#37eb9a>sɪɢᴜɪᴇɴᴛᴇ ᴘáɢɪɴᴀ'
      lore:
        - '<#2cc483> ▸ <#f8f8ff>Clic para ir a la página <#37eb9a>{target_page}'
    close:
      name: '<#ff6b6b><smallcaps>Cerrar</smallcaps>'
      lore:
        - '<#ff6b6b> ▸ <white>¡Clic para cerrar!'
    back:
      name: '<white><smallcaps>Volver a</smallcaps> <#ff6b6b>{previous_menu}'
      lore:
        - '<red> ▸ <white>¡Clic para volver!'
    # What {previous_menu} shows.
    menu_names:
      server_selection: 'sᴇʟᴇᴄᴄɪóɴ ᴅᴇ sᴇʀᴠɪᴅᴏʀ'
      world_selection: 'sᴇʟᴇᴄᴄɪóɴ ᴅᴇ ᴍᴜɴᴅᴏ'
      spawner_list: 'ʟɪsᴛᴀ ᴅᴇ ɢᴇɴᴇʀᴀᴅᴏʀᴇs'
      spawner_management: 'ɢᴇsᴛɪóɴ ᴅᴇ ɢᴇɴᴇʀᴀᴅᴏʀᴇs'

  list:
    # {server}. Only shown on cross-server setups.
    servers:
      title: 'sᴇʟᴇᴄᴄɪᴏɴᴀʀ sᴇʀᴠɪᴅᴏʀ'
      current:
        name: '<#37eb9a>{server}'
        lore:
          - ''
          - ' <#37eb9a>ℹ ᴇsᴛᴀᴅᴏ:'
          - '  <dark_gray>• <white>Servidor actual'
          - ''
          - '<#37eb9a> ▸ ¡Clic para ver los generadores!'
      remote:
        name: '<#f0c857>{server}'
        lore:
          - ''
          - ' <#f0c857>ℹ ᴇsᴛᴀᴅᴏ:'
          - '  <dark_gray>• <white>Servidor remoto'
          - ''
          - '<#f0c857> ▸ ¡Clic para ver los generadores!'

    # {world_name} {total} {total_stacked} {remote_world_lore} {server}
    worlds:
      title: 'sᴇʟᴇᴄᴄɪᴏɴᴀʀ ᴍᴜɴᴅᴏ'
      title_server: '{server} ᴍᴜɴᴅᴏs'
      names:
        overworld: 'Overworld'
        nether: 'Nether'
        the_end: 'The End'
        custom: 'Mundo {world_name}'
      buttons:
        NORMAL:
          name: '<#37eb9a>{world_name}'
          lore:
            - ''
            - ' <#37eb9a>ℹ ᴇsᴛᴀᴅísᴛɪᴄᴀs:'
            - '  <dark_gray>• <white>Número de generadores: <yellow>{total}'
            - '  <dark_gray>• <white>Generadores apilados: <yellow>{total_stacked}'
            - '{remote_world_lore}'
            - ''
            - '<#37eb9a> ▸ ¡Clic para abrir la lista!'
        NETHER:
          name: '<#ff6b6b>{world_name}'
          lore:
            - ''
            - ' <#ff6b6b>ℹ ᴇsᴛᴀᴅísᴛɪᴄᴀs:'
            - '  <dark_gray>• <white>Número de generadores: <yellow>{total}'
            - '  <dark_gray>• <white>Generadores apilados: <yellow>{total_stacked}'
            - '{remote_world_lore}'
            - ''
            - '<#ff6b6b> ▸ ¡Clic para abrir la lista!'
        THE_END:
          name: '<#c8a2ff>{world_name}'
          lore:
            - ''
            - ' <#c8a2ff>ℹ ᴇsᴛᴀᴅísᴛɪᴄᴀs:'
            - '  <dark_gray>• <white>Número de generadores: <yellow>{total}'
            - '  <dark_gray>• <white>Generadores apilados: <yellow>{total_stacked}'
            - '{remote_world_lore}'
            - ''
            - '<#c8a2ff> ▸ ¡Clic para abrir la lista!'
        CUSTOM:
          name: '<#5db5f1>{world_name}'
          lore:
            - ''
            - ' <#5db5f1>ℹ <smallcaps>Stats</smallcaps>:'
            - '  <dark_gray>• <white>Número de generadores: <yellow>{total}'
            - '  <dark_gray>• <white>Generadores apilados: <yellow>{total_stacked}'
            - '{remote_world_lore}'
            - ''
            - '<#5db5f1> ▸ ¡Clic para abrir la lista!'
      remote_lore:
        - ''
        - ' <#f0c857>ℹ <smallcaps>Mundo remoto</smallcaps>:'
        - '  <dark_gray>• <white>Servidor: <yellow>{server}'

    # {current} {total} {world} {server} {available_options} {option_name} {id} {entity} {size} {status} {last_player} {x} {y} {z}
    spawners:
      title: '[{current}/{total}] {world}'
      title_remote: '[{current}/{total}] {world} ({server})'
      filter:
        name: '<white>ғɪʟᴛʀᴀʀ <#5db5f1>ɢᴇɴᴇʀᴀᴅᴏʀᴇs'
        lore:
          - ''
          - '{available_options}'
          - ''
          - '<#5db5f1> ▸ ¡Clic para cambiar el filtro!'
      filter_options:
        all: 'Todo'
        active: 'Activo'
        inactive: 'Inactivo'
      sort:
        name: '<white><smallcaps>Orden</smallcaps> <#5db5f1>ɢᴇɴᴇʀᴀᴅᴏʀᴇs'
        lore:
          - ''
          - '{available_options}'
          - ''
          - '<#5db5f1> ▸ ¡Clic para cambiar el orden!'
      sort_options:
        default: 'Por defecto (ID)'
        stack_size_asc: 'Tamaño del stack (↑)'
        stack_size_desc: 'Tamaño del stack (↓)'
      selected_option: ' <#5db5f1>• {option_name}'
      unselected_option: ' <white>• {option_name}'
      spawner:
        name: '<white><smallcaps>Generador</smallcaps> <#5db5f1>#{id}'
        lore:
          - ''
          - ' <#5db5f1>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
          - '  <dark_gray>• <white>Entidad: <yellow>{entity}'
          - '  <dark_gray>• <white>Apilado: <yellow>{size}'
          - '  <dark_gray>• <white>Estado: {status}'
          - '  <dark_gray>• <white>Último jugador: <yellow>{last_player}'
          - '  <dark_gray>• <white>Ubicación: <gray>x: {x}, y: {y}, z: {z}'
          - ''
          - '<#5db5f1> ▸ ¡Clic para gestionar el generador!'
        remote_lore:
          - ''
          - ' <#5db5f1>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
          - '  <dark_gray>• <white>Entidad: <yellow>{entity}'
          - '  <dark_gray>• <white>Apilado: <yellow>{size}'
          - '  <dark_gray>• <white>Estado: {status}'
          - '  <dark_gray>• <white>Último jugador: <yellow>{last_player}'
          - '  <dark_gray>• <white>Ubicación: <gray>x: {x}, y: {y}, z: {z}'
          - ''
          - '<#ff6b6b> ⚠ ¡No se puede gestionar el generador remoto!'
        last_player_none: 'Nadie'
        status:
          active: '<#00e689>Activo'
          inactive: '<#ff6b6b>Inactivo'

    manage:
      title: 'ɢᴇsᴛɪᴏɴᴀʀ ɢᴇɴᴇʀᴀᴅᴏʀ'
      teleport:
        name: '<white>ᴛᴇʟᴇᴛʀᴀɴsᴘᴏʀᴛᴀʀsᴇ <#5db5f1><smallcaps>Al generador</smallcaps>'
        lore:
          - '<#5db5f1> ▸ <white>¡Clic para teletransportarte!'
      open_spawner:
        name: '<white><smallcaps>Abrir</smallcaps> <#5db5f1>ɪɴᴛᴇʀғᴀᴢ ᴅᴇʟ ɢᴇɴᴇʀᴀᴅᴏʀ'
        lore:
          - '<#5db5f1> ▸ <white>¡Clic para abrir el menú!'
      remove:
        name: '<white><smallcaps>Eliminar</smallcaps> <#ff6b6b><smallcaps>Generador</smallcaps>'
        lore:
          - '<#ff6b6b> ▸ <white>¡Clic para eliminar este generador!'

  # {current_page} {total_pages} {item_name} {price} {price_source} {custom_price} {shop_price}
  prices:
    title: '[{current_page}/{total_pages}] ᴘʀᴇᴄɪᴏs ᴅᴇ ᴠᴇɴᴛᴀ'
    item:
      name: '<white>{item_name} <#5db5f1><smallcaps>Precio</smallcaps>'
      lore:
        - ''
        - ' <#5db5f1>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
        - '  <dark_gray>• <white>Precio final: <green>${price}'
        - '  <dark_gray>• <white>Fuente: <yellow>{price_source}'
        - '  <dark_gray>• <white>Precio personalizado: <green>${custom_price}'
        - '  <dark_gray>• <white>Precio en tienda: <green>${shop_price}'

  # {entry} {label} {item} {amount} {chance} {durability} {max}
  editloot:
    mob_loot_title: 'ʙᴏᴛíɴ • {entry}'
    item_loot_title: 'ᴏʙᴊᴇᴛᴏs • {entry}'
    capture_add_title: 'sᴜᴇʟᴛᴀ ᴜɴ ᴏʙᴊᴇᴛᴏ ᴘᴀʀᴀ ᴀñᴀᴅɪʀ'
    capture_replace_title: 'sᴜᴇʟᴛᴀ ᴜɴ ɴᴜᴇᴠᴏ ᴏʙᴊᴇᴛᴏ'

    loot_entry:
      name: '<white>ʙᴏᴛíɴ <#37eb9a>{label}'
      lore:
        - ''
        - ' <#37eb9a>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
        - '  <dark_gray>• <white>Objeto: <yellow>{item}'
        - '  <dark_gray>• <white>Cantidad: <yellow>{amount}'
        - '  <dark_gray>• <white>Probabilidad: <yellow>{chance}%'
        - '  <dark_gray>• <white>Durabilidad: <yellow>{durability}'
        - ''
        - '<#37eb9a> ▸ <white>¡Clic izquierdo para modificar los valores!'
        - '<#37eb9a> ▸ <white>¡Clic derecho para modificar los objetos!'

    loot_broken:
      name: '<white>ʙᴏᴛíɴ <#ff6b6b>{label}'
      lore:
        - ''
        - ' <#ff6b6b>⚠ <smallcaps>Advertencia</smallcaps>:'
        - '  <dark_gray>• <white>Este objeto no se puede leer.'
        - '  <dark_gray>• <white>Valor: <yellow>{item}'
        - ''
        - '<#ff6b6b> ▸ <white>¡Clic derecho para establecer un nuevo objeto!'

    add_loot:
      name: '<white>ᴀñᴀᴅɪʀ <#37eb9a>ʙᴏᴛíɴ'
      lore:
        - ''
        - ' <#37eb9a>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
        - '  <dark_gray>• <white>Añade otro objeto de botín.'
        - ''
        - '<#37eb9a> ▸ <white>¡Clic para elegir un objeto!'

    capture_hint:
      name: '<white>sᴏʟᴛᴀʀ ᴜɴ ᴏʙᴊᴇᴛᴏ <#5db5f1><smallcaps>En el medio</smallcaps>'
      lore:
        - ''
        - ' <#5db5f1>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
        - '  <dark_gray>• <white>El objeto se guardará tal cual.'
        - '  <dark_gray>• <white>Se te devolverá cuando te vayas.'

    cancel:
      name: '<white><smallcaps>Cancelar</smallcaps> <#ff6b6b><smallcaps>Captura</smallcaps>'
      lore:
        - ''
        - ' <#ff6b6b>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
        - '  <dark_gray>• <white>Desechar esta captura.'
        - ''
        - '<#ff6b6b> ▸ <white>¡Clic para cancelar!'

    confirm:
      name: '<white>ᴄᴏɴғɪʀᴍᴀʀ <#37eb9a><smallcaps>Objeto</smallcaps>'
      lore:
        - ''
        - ' <#37eb9a>ℹ ɪɴғᴏʀᴍᴀᴄɪóɴ:'
        - '  <dark_gray>• <white>Continúa estableciendo la cantidad y probabilidad.'
        - ''
        - '<#37eb9a> ▸ <white>¡Clic para continuar!'

    # Text inside the loot settings dialog. Keep it short.
    dialog_title:
      name: 'ᴄᴏɴғɪɢᴜʀᴀᴄɪóɴ ᴅᴇ ʙᴏᴛíɴ'
    dialog_body:
      name: '<gray>La cantidad y durabilidad aceptan un rango entr <white>0 y 2<gray>.'
    dialog_save:
      name: '<green>✔ <white>Guardar'
    dialog_cancel:
      name: '<red>← <white>Cancelar'
    dialog_delete:
      name: '<dark_red>✖ <white>Eliminar botín'
    field_amount:
      name: 'Cantidad (ej. 1 or 0-2)'
    field_chance:
      name: 'Probabilidad % (0-100)'
    field_durability:
      name: 'Durabilidad (vacío para ninguno, ej. 1-384)'
    error_amount:
      name: '<red>La cantidad debe ser un número entero entre 0 y {max}, y el mínimo no puede superar al máximo.'
    error_chance:
      name: '<red>La probabilidad debe ser un número del 0 al 100.'
    error_durability:
      name: '<red>La durabilidad debe ser un número entero, y el mínimo no puede superar al máximo.'
