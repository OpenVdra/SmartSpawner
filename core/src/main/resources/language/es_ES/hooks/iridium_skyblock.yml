# SmartSpawner IridiumSkyblock permission names
# Full guide: https://docs.smartspawner.site/docs/language
# Only written and read while the IridiumSkyblock hook is active. %permission% is filled in by IridiumSkyblock.

iridium_skyblock:
  permissions:
    open_menu:
      name: '<#5db5f1>ᴘᴇʀᴍɪsᴏ ᴅᴇ ᴍᴇɴú ᴅᴇʟ ɢᴇɴᴇʀᴀᴅᴏʀ'
      lore:
        - '<gray>Permiso para permitir a los usuarios abrir el menú.'
        - ''
        - '<#5db5f1><bold>Permiso'
        - '%permission%'
    stack:
      name: '<#37eb9a>ᴘᴇʀᴍɪsᴏ ᴘᴀʀᴀ ᴀᴘɪʟᴀʀ ɢᴇɴᴇʀᴀᴅᴏʀᴇs'
      lore:
        - '<gray>Permiso para permitir a los usuarios apilar generadores.'
        - ''
        - '<#37eb9a><bold>Permiso'
        - '%permission%'
