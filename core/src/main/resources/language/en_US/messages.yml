# SmartSpawner messages
# Full guide: https://docs.smartspawner.site/docs/language
# Colours: MiniMessage (<red>, <#5DB5F1>, <gradient:#5DB5F1:#FFFFFF>) or legacy (&c, &#5DB5F1).
# Each message can use message, title, subtitle, action_bar and sound. enabled: false mutes it.

prefix: '<#3498db>SᴍᴀʀᴛSᴘᴀᴡɴᴇʀ <dark_gray>⏩ <reset>'

# {key}
missing_key:
  message: '<#ff4444>Missing message key: <white>{key}'

general:
  inventory_full:
    message: '<#ff4444>Your inventory is full.'
  click_too_fast:
    message: '<#ff4444>You are clicking too fast.'
    sound: block.note_block.bass
  action_in_progress:
    message: '<#f0c857>There is already an action in progress. Please wait.'
    action_bar: '<#f0c857>Action in progress. Please wait.'
  action_failed:
    message: '<#ff4444>The action failed. Please try again.'
    action_bar: '<#ff4444>The action failed. Please try again.'
  # {time}
  action_not_ready:
    message: '<#f0c857>This action is not ready yet. Try again in <white>{time}<#f0c857>.'
    sound: block.note_block.bass

spawner:
  activated:
    message: 'The spawner has been<green> activated. <reset>You can now collect drops and EXP.'
    sound: block.beacon.activate
  # {entity}
  entity_changed:
    message: 'The spawner changed to <yellow>{entity}<white>.'
    action_bar: '<white>The spawner changed to <yellow>{entity}<white>.'
    sound: entity.player.levelup

storage:
  empty:
    message: '<#ff4444>Spawner storage is empty.'
  in_use:
    message: '<#ff4444>This spawner storage is currently open by another player.'
    action_bar: '<#ff4444>Storage is currently in use by another player.'

# {exp} {exp_mending}
exp:
  none:
    message: '<#ff4444>There is no EXP available'
  collected:
    message: 'You collected <green>{exp} <white>experience.'
    action_bar: '<green>+{exp} EXP'
  collected_mending:
    message: 'You collected <green>{exp} <white>experience. <red>{exp_mending} <white>was used on Mending.'
    action_bar: '<green>+{exp} EXP <white>| <red>-{exp_mending} used on Mending'

stack:
  different_type:
    message: '<#ff4444>Spawners must be the same type to stack.'
    action_bar: '<#ff4444>Spawners must be the same type.'
    sound: block.note_block.pling
  # {max}
  full:
    action_bar: '<#ff4444>Maximum stack limit: <white>{max}'
    sound: block.note_block.pling
  # {amount}
  success:
    action_bar: '<green>You successfully stacked <white>{amount} <green>spawner(s).'
    sound: entity.player.levelup

break:
  no_permission:
    message: '<#ff4444>You do not have permission to break this spawner.'
    sound: entity.villager.no
  silk_touch_required:
    message: '<#ff4444>You need Silk Touch to break this spawner.'
    action_bar: '<#ff4444>You need Silk Touch.'
    sound: item.shield.block
  wrong_tool:
    message: '<#ff4444>You cannot break spawner with this tool.'
    action_bar: '<#ff4444>Cannot break spawner with this tool.'
    sound: item.shield.block
  no_drop:
    message: '<#ff4444>No luck this time - the spawner did not drop.'
    action_bar: '<#ff4444>The spawner did not drop.'
    sound: block.note_block.pling
  sneak_blocked:
    message: '<#ff4444>You cannot break the whole stack when this spawner has drop chance.'
    action_bar: '<#ff4444>Cannot break whole stack.'
    sound: block.note_block.pling

# {amount} {price} {exp} {exp_mending}
sell:
  nothing_to_sell:
    message: '<#ff4444>No sellable items were found.'
  success:
    message: 'You sold <yellow>{amount} <white>item(s) for <green>${price}<white>.'
    action_bar: '<green>+${price}'
  success_with_exp:
    message: 'You sold <yellow>{amount} <white>item(s) for <green>${price}<white> and collected <green>{exp} <white>EXP.'
    action_bar: '<green>+${price} <white>| <green>+{exp} EXP'
  success_with_exp_mending:
    message: 'You sold <yellow>{amount} <white>item(s) for <green>${price}<white>, collected <green>{exp} <white>EXP <white>(<red>{exp_mending} <white>used on Mending).'
    action_bar: '<green>+${price} <white>| <green>+{exp} EXP <white>(<red>-{exp_mending} Mending)'

command:
  player_only:
    message: '<#ff4444>This command can only be used by players.'
    sound: block.note_block.bass
  no_permission:
    message: '<#ff4444>You do not have permission to do this.'
    sound: block.note_block.pling

  list:
    no_spawners_found:
      message: '<#ff4444>No spawners were found.'
      sound: block.note_block.pling
    teleported_to_spawner:
      message: 'You were teleported to the spawner.'
      sound: entity.enderman.teleport
    teleport_failed:
      message: '<#ff4444>Unable to teleport to spawner.'
      sound: entity.enderman.teleport
    spawner_removed:
      message: '<white>The spawner was <#ff4444>removed <white>successfully.'
      sound: entity.item.break

  # {value} {max} {property} {old_value} {new_value} {world} {x} {y} {z}
  set:
    usage:
      message: 'Usage: <#3498db>/ss set <stack_size|range|delay> \<value> [world x y z]'
      sound: block.note_block.hat
    invalid:
      message: '<#ff4444>Invalid value or SmartSpawner location.'
      sound: block.note_block.pling
    stack_size_exceeds_max:
      message: '<#ff4444>Stack size <white>{value} <#ff4444>exceeds this spawner''s max stack size: <white>{max}'
      sound: block.note_block.pling
    location_required:
      message: '<#f0c857>Console must provide a location: <#3498db>/ss set <stack_size|range|delay> \<value> \<world> \<x> \<y> \<z>'
      sound: block.note_block.pling
    success:
      message: 'Set <green>{property} <white>from <yellow>{old_value} <white>to <green>{new_value} <white>at <#3498db>{world} {x} {y} {z}<white>.'
      sound: entity.experience_orb.pickup

  # {percent} {count} {radius}
  near:
    bossbar:
      analyzing: 'Scanning nearby spawners... {percent}%'
      found: 'Found {count} spawner(s) within {radius} blocks.'
      not_found: 'No spawners found within {radius} blocks.'
    view_gui:
      button: ' [View in GUI]'
      hover: 'Click to browse the {count} spawner(s) found nearby.'
    scan_start:
      message: 'Scanning for spawners within <yellow>{radius} <white>blocks...'
      sound: block.note_block.hat
    scan_found:
      message: 'Found <green>{count} <white>spawner(s) within <yellow>{radius} <white>blocks. Highlights last <yellow>30s<white>.'
      sound: entity.experience_orb.pickup
    scan_none:
      message: '<#ff4444>No spawners found within <white>{radius} <#ff4444>blocks.'
      sound: block.note_block.pling
    scan_cancelled:
      message: '<#f0c857>Scan cancelled and highlights removed.'
      sound: block.note_block.bass
    no_active_scan:
      message: '<#ff4444>You do not have an active scan to cancel.'
      sound: block.note_block.bass
    highlights_expired:
      message: '<#888888>Spawner highlights have expired.'

  # {amount} {entity} {player}
  give:
    player_not_found:
      message: '<#ff4444>Player not found.'
      sound: block.note_block.pling
    invalid_mob_type:
      message: '<#ff4444>Invalid mob type or spawner name.'
      sound: block.note_block.pling
    invalid_item_type:
      message: '<#ff4444>Invalid item type.'
      sound: block.note_block.pling
    invalid_item_spawner:
      message: '<#ff4444>Invalid Item Spawner name.'
      sound: block.note_block.pling
    inventory_full:
      message: '<#ff4444>Some spawner items were dropped because the inventory is full.'
      sound: block.note_block.pling
    spawner_received:
      message: 'You received <green>{amount} {entity} <white>spawner(s).'
      sound: entity.experience_orb.pickup
    spawner_given:
      message: 'Gave <green>{amount} {entity} <white>spawner(s) to <#3498db>{player}<white>.'
      sound: entity.experience_orb.pickup

  hologram:
    enabled:
      message: 'Holograms are <green>enabled <white>for all spawners.'
      sound: entity.experience_orb.pickup
    disabled:
      message: 'Holograms are <#ff4444>disabled <white>for all spawners.'
      sound: block.note_block.bass
    cleared:
      message: 'Successfully cleared <green>all holograms<white>.'
      sound: entity.experience_orb.pickup
    clear_error:
      message: '<#ff4444>Failed to clear holograms.'
      sound: block.note_block.pling

  # {count}
  clear:
    usage:
      message: 'Usage: <#3498db>/ss clear <holograms|ghost_spawners>'
      sound: block.note_block.hat
    ghost_check_start:
      message: 'Checking for ghost spawners...'
      sound: block.note_block.hat
    ghost_cleared:
      message: 'Successfully removed <green>{count} <white>ghost spawner(s).'
      sound: entity.experience_orb.pickup
    ghost_none_found:
      message: '<#ff4444>No ghost spawners found.'
      sound: entity.experience_orb.pickup

  prices:
    not_available:
      message: '<#ff4444>Sell integration is not available. Please configure economy settings.'
      sound: block.note_block.pling
    no_priceable_items:
      message: '<#ff4444>No items with prices were found.'
      sound: block.note_block.pling

  reload:
    start:
      message: '<#f0c857>Reloading plugin... Please wait.'
    success:
      message: 'Successfully reloaded <#3498db>SmartSpawner<white>.'
      sound: entity.experience_orb.pickup
    error:
      message: '<#ff4444>Failed to reload SmartSpawner. Please check console for details.'
      sound: block.note_block.pling

  # {current} {available} {value} {old_value} {new_value}
  language:
    current:
      message: 'Current language: <green>{current} <#888888>| <white>Available: {available}'
      sound: block.note_block.hat
    invalid:
      message: '<#ff4444>Unknown language: <white>{value}<#ff4444>. Try: <white>{available}'
      sound: block.note_block.pling
    already_set:
      message: '<#f0c857>Language is already set to <white>{value}<#f0c857>.'
      sound: block.note_block.hat
    success:
      message: 'Language changed from <yellow>{old_value} <white>to <green>{new_value}<white>.'
      sound: entity.experience_orb.pickup
    error:
      message: '<#ff4444>Failed to change language. Please check console.'
      sound: block.note_block.pling

  # {current} {available} {value} {old_value} {new_value}
  gui_layout:
    current:
      message: 'Current layout: <green>{current} <#888888>| <white>Available: {available}'
      sound: block.note_block.hat
    invalid:
      message: '<#ff4444>Unknown GUI layout: <white>{value}<#ff4444>. Try: <white>{available}'
      sound: block.note_block.pling
    already_set:
      message: '<#f0c857>GUI layout is already set to <white>{value}<#f0c857>.'
      sound: block.note_block.hat
    success:
      message: 'GUI layout changed from <yellow>{old_value} <white>to <green>{new_value}<white>.'
      sound: entity.experience_orb.pickup
    error:
      message: '<#ff4444>Failed to change GUI layout. Please check console.'
      sound: block.note_block.pling

  # {name} {label}
  editloot:
    usage:
      message: 'Usage: <#37eb9a>/ss editloot <spawner name><white>. Example: <#37eb9a>/ss editloot blaze_spawner'
      sound: block.note_block.hat
    unknown_entry:
      message: '<#ff4444>No spawner named <white>{name}<#ff4444>. Use tab completion to see valid names.'
      sound: block.note_block.bass
    entry_missing:
      message: '<#ff4444>That entry is no longer in the file.'
      sound: block.note_block.bass
    loot_added:
      message: '<#37eb9a>Added loot entry <white>{label}<#37eb9a>.'
      sound: entity.experience_orb.pickup
    loot_saved:
      message: '<#37eb9a>Saved loot entry <white>{label}<#37eb9a>.'
      sound: entity.experience_orb.pickup
    loot_replaced:
      message: '<#37eb9a>Updated the item for <white>{label}<#37eb9a>.'
      sound: entity.experience_orb.pickup
    loot_deleted:
      message: '<#ff6b6b>Removed loot entry <white>{label}<#ff6b6b>.'
      sound: entity.item.pickup
    capture_empty:
      message: '<#ff4444>Put an item in the middle slot first.'
      sound: block.note_block.bass
