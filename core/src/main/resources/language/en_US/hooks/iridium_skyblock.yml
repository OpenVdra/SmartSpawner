# SmartSpawner IridiumSkyblock permission names
# Full guide: https://docs.smartspawner.site/docs/language
# Only written and read while the IridiumSkyblock hook is active. %permission% is filled in by IridiumSkyblock.

iridium_skyblock:
  permissions:
    open_menu:
      name: '<#5db5f1><smallcaps>Spawner menu permission</smallcaps>'
      lore:
        - '<gray>Permission for permit users to open spawners menu.'
        - ''
        - '<#5db5f1><bold>Permission'
        - '%permission%'
    stack:
      name: '<#37eb9a><smallcaps>Spawner stack permission</smallcaps>'
      lore:
        - '<gray>Permission for permit users to stack spawners.'
        - ''
        - '<#37eb9a><bold>Permission'
        - '%permission%'
