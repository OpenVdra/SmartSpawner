    - '  <dark_gray>• <white>商店价格：<green>${shop_price}'

# ──────────────────────────────────────────────────────
#              Loot Editor (/ss editloot)
# ──────────────────────────────────────────────────────
editloot:
  mob_loot_title: '生物战利品 • {entry}'
  item_loot_title: '物品战利品 • {entry}'
  capture_add_title: '丢弃物品以添加'
  capture_replace_title: '放入新物品'

  loot_entry:
    name: '<white>战利品 <#37eb9a>{label}'
    lore:
      - ''
      - ' <#37eb9a>ℹ 信息：'
      - '  <dark_gray>• <white>物品：<yellow>{item}'
      - '  <dark_gray>• <white>数量：<yellow>{amount}'
      - '  <dark_gray>• <white>概率：<yellow>{chance}%'
      - '  <dark_gray>• <white>耐久：<yellow>{durability}'
      - ''
      - '<#37eb9a> ▸ <white>左键点击编辑数值！'
      - '<#37eb9a> ▸ <white>右键点击更换物品！'

  loot_broken:
    name: '<white>战利品 <#ff6b6b>{label}'
    lore:
      - ''
      - ' <#ff6b6b>⚠ 警告：'
      - '  <dark_gray>• <white>无法读取此物品。'
      - '  <dark_gray>• <white>值：<yellow>{item}'
      - ''
      - '<#ff6b6b> ▸ <white>右键点击设置新物品！'

  add_loot:
    name: '<white>添加 <#37eb9a>战利品'
    lore:
      - ''
      - ' <#37eb9a>ℹ 信息：'
      - '  <dark_gray>• <white>添加另一个战利品物品。'
      - ''
      - '<#37eb9a> ▸ <white>点击选择物品！'

  capture_hint:
    name: '<white>将物品 <#5db5f1>丢到中间'
    lore:
      - ''
      - ' <#5db5f1>ℹ 信息：'
      - '  <dark_gray>• <white>物品将按原样保存。'
      - '  <dark_gray>• <white>离开时会归还予你。'

  cancel:
    name: '<white>取消 <#ff6b6b>捕获'
    lore:
      - ''
      - ' <#ff6b6b>ℹ 信息：'
      - '  <dark_gray>• <white>放弃此捕获。'
      - ''
      - '<#ff6b6b> ▸ <white>点击取消！'

  confirm:
    name: '<white>确认 <#37eb9a>物品'
    lore:
      - ''
      - ' <#37eb9a>ℹ 信息：'
      - '  <dark_gray>• <white>继续设置数量和概率。'
      - ''
      - '<#37eb9a> ▸ <white>点击继续！'

  # Dialog text. Rendered inside the client dialog, so keep it short.
  dialog_title:
    name: '战利品设置'
  dialog_body:
    name: '<gray>数量和耐久支持范围格式，如 <white>0-2<gray>。'
  dialog_save:
    name: '<green>✔ <white>保存'
  dialog_cancel:
    name: '<red>← <white>取消'
  dialog_delete:
    name: '<dark_red>✖ <white>删除战利品'
  field_amount:
    name: '数量（例如 1 或 0-2）'
  field_chance:
    name: '概率 %（0-100）'
  field_durability:
    name: '耐久（留空为无，例如 1-384）'
  error_amount:
    name: '<red>数量必须为 0-{max} 的整数，且最小值不能大于最大值。'
  error_chance:
    name: '<red>概率必须为 0 到 100 的数字。'
  error_durability:
    name: '<red>耐久必须为整数，且最小值不能大于最大值。'
