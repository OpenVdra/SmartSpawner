# SmartSpawner – gui.yml
# GUI item names, lore, titles, and button labels.

# ──────────────────────────────────────────────────────
#                  Main GUI
# ──────────────────────────────────────────────────────
gui_title_main:
  single_spawner: '{ᴇɴᴛɪᴛʏ} 刷怪笼'
  stacked_spawner: '{amount} 个 {entity} 刷怪笼'

spawner_storage_item:
  # Available placeholders for name:
  # {max_slots} - Maximum number of slots in the storage (formatted with commas)
  # {current_items} - Current number of items in the storage
  # {percent_storage_rounded} - Percentage of storage used (0-100)
  # {total_sell_price} - Total sell value currently stored in the spawner
  # {entity} - The spawner's entity type (normal capitalization)
  # {ᴇɴᴛɪᴛʏ} - The spawner's entity type (small caps)
  name: '<white>打开 <#5db5f1>存储'

  # Available placeholders for all lore lines:
  # {max_slots} - Maximum number of slots in the storage (formatted with commas)
  # {current_items} - Current number of items in the storage
  # {percent_storage_rounded} - Percentage of storage used (0-100)
  # {total_sell_price} - Total sell value currently stored in the spawner
  # {loot_items} - The complete formatted list of loot items
  # {entity} - The spawner's entity type (normal capitalization)
  # {ᴇɴᴛɪᴛʏ} - The spawner's entity type (small caps)
  lore:
    - ''
    - ' <#5db5f1>ℹ 信息：'
    - '  <dark_gray>• <white>你可以在此查看并'
    - '   <white>管理此刷怪笼中'
    - '   <white>存储的所有物品。'
    - ''
    - ' <#5db5f1>★ 容量：<white>{percent_storage_rounded}%'
    - '{loot_items}'
    - ''
    - '<#5db5f1> ▸ 点击打开存储！'

  # This defines how each loot item will be displayed when using {loot_items}
  # Available placeholders for each loot item:
  # {item_name} - The name of the item (normal capitalization)
  # {amount} - Number of items (formatted with commas)
  # {raw_amount} - Number of items (without formatting)
  # {chance} - The chance of this item dropping (with % symbol, e.g. "8.5%")
  loot_items: '  <dark_gray>• <white>{item_name}<white>：<yellow>{amount}'
  loot_items_empty: '  <dark_gray>• <white>无存储物品'


# Available placeholders:
# {entity}           - Formatted entity name (e.g., "Zombie")
# {ᴇɴᴛɪᴛʏ}           - Entity name in small caps (e.g., "ᴢᴏᴍʙɪᴇ")
# {stack_size}       - Number of spawners stacked at this location
# {range}            - Spawning range in blocks
# {delay}            - Spawn delay in seconds
# {min_mobs}         - Minimum number of mobs to spawn
# {max_mobs}         - Maximum number of mobs to spawn
# {current_items}    - Current number of items stored
# {max_items}        - Maximum storage capacity for items
# {percent_storage_rounded}  - Storage usage as integer percentage (e.g., "87")
# {percent_storage_decimal} - Storage usage as formatted percentage with decimal (e.g., "87.5")
# {current_exp}      - Current experience stored (formatted with commas)
# {max_exp}          - Maximum experience capacity (formatted with commas)
# {raw_current_exp}  - Raw current experience number
# {raw_max_exp}      - Raw maximum experience number
# {percent_exp_rounded}      - Experience storage as integer percentage
# {percent_exp_decimal}    - Experience storage as formatted percentage with decimal (e.g., "42.7")
# {time}             - Time until the next spawn, or a status text when inactive/full/no loot
# {total_sell_price} - Total sell value currently stored in the spawner
spawner_info_item:
  name: ' <white>刷怪笼 <#5db5f1>信息'
  lore:
    - ''
    - ' <#5db5f1>ℹ 统计：'
    - '   <dark_gray>• <white>堆叠：<yellow>{stack_size}'
    - '   <dark_gray>• <white>范围：<yellow>{range} <white>格'
    - '   <dark_gray>• <white>生物：<yellow>{min_mobs}<white>-<yellow>{max_mobs}'
    - '   <dark_gray>• <white>延迟：<yellow>{delay} <white>秒'
    - ''
    - ' <#5db5f1>★ 下次生成：<white>{time}'
    - '   <dark_gray>• <white>经验：<yellow>{percent_exp_rounded}%'
    - '   <dark_gray>• <white>存储：<yellow>{percent_storage_rounded}%'
    - '   <dark_gray>• <white>出售价值：<green>${total_sell_price}'
    - ''
    - '<#5db5f1> ▸ 左键：<white>出售并收集经验'
  lore_no_shop:
    - ''
    - ' <#5db5f1>ℹ 统计：'
    - '   <dark_gray>• <white>堆叠：<yellow>{stack_size}'
    - '   <dark_gray>• <white>范围：<yellow>{range} <white>格'
    - '   <dark_gray>• <white>生物：<yellow>{min_mobs}<white>-<yellow>{max_mobs}'
    - '   <dark_gray>• <white>延迟：<yellow>{delay} <white>秒'
    - ''
    - ' <#5db5f1>★ 下次生成：<white>{time}'
    - '   <dark_gray>• <white>经验：<yellow>{percent_exp_rounded}%'
    - '   <dark_gray>• <white>存储：<yellow>{percent_storage_rounded}%'
    - ''
  lore_full: '<#ff4444>容量已满'
  lore_inactive: '<#ff4444>未激活'
  lore_no_loot: '<#ff4444>未配置掉落物'

exp_info_item:
  name: '<white>收集 <#5db5f1>经验'
  lore:
    - ''
    - ' <#5db5f1>ℹ 信息：'
    - '  <dark_gray>• <white>收集经验或使用'
    - '   <white>经验来修复你的'
    - '   <white>经验修补 <white>装备。'
    - ''
    - ' <#5db5f1>★ 容量：<white>{percent_exp_rounded}%'
    - '  <dark_gray>• <white>存储经验：<green>{current_exp}<white>/<green>{max_exp}'
    - ''
    - '<#5db5f1> ▸ 点击收集经验！'

# ──────────────────────────────────────────────────────
#                Sell Confirmation GUI
# ──────────────────────────────────────────────────────
gui_title_sell_confirm: '确认出售'

button_sell_cancel:
  name: '<white>取消 <#ff6b6b>出售'
  lore:
    - ''
    - ' <#ff6b6b>⚠ 信息：'
    - '  <dark_gray>• <white>点击返回'
    - '   <white>不进行任何出售。'
    - ''
    - '<#ff6b6b> ▸ 点击取消！'

button_sell_confirm:
  name: '<white>确认 <#5db5f1>出售'
  lore:
    - ''
    - ' <#5db5f1>ℹ 你将获得：'
    - '  <dark_gray>• <white>金币：<green>${total_sell_price}'
    - ''
    - '<#5db5f1> ▸ 点击确认出售！'

button_sell_confirm_with_exp:
  name: '<white>确认出售 <#5db5f1>并收集经验'
  lore:
    - ''
    - ' <#5db5f1>ℹ 你将获得：'
    - '  <dark_gray>• <white>金币：<green>${total_sell_price}'
    - '  <dark_gray>• <white>经验：<green>{current_exp}'
    - ''
    - '<#5db5f1> ▸ 点击确认！'

# Available placeholders for button_sell_info:
# {entity} - Formatted entity or item name
# {ᴇɴᴛɪᴛʏ} - Entity or item name in small caps
# {current_items} - Used storage slots
# {max_items} - Maximum storage slots
# {current_exp} - Stored experience
# {total_sell_price} - Total sell value
# {percent_storage_decimal} - Storage usage with 1 decimal (e.g., "87.5")
# {percent_storage_rounded} - Storage usage rounded to whole number (e.g., "88")
# {loot_items} - Expands to the generated loot item lines
# Placeholders for button_sell_info.loot_items: {amount}, {item_name}, {chance}
button_sell_info:
  name: '<white>出售 <#5db5f1>摘要'
  lore:
    - ''
    - ' <#5db5f1>ℹ 信息：'
    - '{loot_items}'
    - '  <dark_gray>• <green>+ <white>经验：<yellow>{current_exp}'
    - '  <dark_gray>• <green>+ <white>金币：<green>${total_sell_price}'
  loot_items: '  <dark_gray>• <#ff6b6b>- <white>{item_name}<white>：<yellow>{amount}'
  loot_items_empty: '  <dark_gray>• <#ff6b6b>- <white>没有可出售的物品'

# ──────────────────────────────────────────────────────
#             Spawner Storage GUI
# ──────────────────────────────────────────────────────
# Available placeholders for gui_title_storage:
# {current_page}     - Current page number
# {total_pages}      - Total number of pages
# {entity}           - Formatted entity name (e.g., "Zombie")
# {ᴇɴᴛɪᴛʏ}           - Entity name in small caps (e.g., "ᴢᴏᴍʙɪᴇ")
# {amount}           - Number of spawners stacked
gui_title_storage: '[{current_page}/{total_pages}] 刷怪笼存储'

navigation_button_previous:
  name: '<#37eb9a>上一页'
  lore:
    - '<#2cc483> ▸ <#f8f8ff>点击前往第 <#37eb9a>{target_page} 页'

navigation_button_next:
  name: '<#37eb9a>下一页'
  lore:
    - '<#2cc483> ▸ <#f8f8ff>点击前往第 <#37eb9a>{target_page} 页'

sell_button:
  name: '<white>出售 <green>物品'
  lore:
    - ''
    - ' <green>ℹ 信息：'
    - '  <dark_gray>• <white>你将出售存储中的'
    - '   <white>所有物品。'
    - ''
    - '<green> ▸ 点击出售！'

sell_and_exp_button:
  name: '<white>出售并 <green>收集经验'
  lore:
    - ''
    - ' <green>ℹ 信息：'
    - '  <dark_gray>• <white>你将出售所有物品'
    - '   <white>并收集存储的经验。'
    - '  <dark_gray>• <white>预计总计：<green>${total_sell_price}'
    - ''
    - '<green> ▸ 点击继续！'

return_button:
  name: '<white>返回 <#ff6b6b>主菜单'
  lore:
    - ''
    - ' <#dadada>ℹ 信息：'
    - '  <dark_gray>• <white>点击返回'
    - '   <white>上一菜单。'
    - ''
    - '<red> ▸ 点击返回！'

take_all_button:
  name: '<white>全部 <#5db5f1>取出'
  lore:
    - ''
    - ' <#5db5f1>ℹ 信息：'
    - '  <dark_gray>• <white>你将取出此页面的'
    - '   <white>所有物品。'
    - ''
    - '<#5db5f1> ▸ 点击取出！'

item_filter_button:
  name: '<white>筛选 <#5db5f1>掉落物'
  lore:
    - ''
    - ' <#5db5f1>ℹ 信息：'
    - '  <dark_gray>• <white>配置此刷怪笼允许和'
    - '   <white>阻止的物品。'
    - ''
    - '<#5db5f1> ▸ 点击配置筛选！'

sort_items_button:
  name: '<white>排序 <#5db5f1>物品'
  lore:
    - ''
    - '{available_items}'
    - ''
    - '<#5db5f1> ▸ 点击排序！'
  selected_item: ' <#5db5f1>• {item_name}'
  unselected_item: ' <white>• {item_name}'
  no_item: ' <gray>• 无'

drop_page_button:
  name: '<white>丢弃 <#ff6b6b>本页'
  lore:
    - ''
    - ' <#ff6b6b>⚠ 警告：'
    - '  <dark_gray>• <white>你将把此页面的所有物品'
    - '   <white>丢弃到地上。'
    - ''
    - '<#ff6b6b> ▸ 点击丢弃！'

collect_exp_button:
  name: '<white>收集 <#5db5f1>经验'
  lore:
    - ''
    - ' <#5db5f1>ℹ 信息：'
    - '  <dark_gray>• <white>可用经验：<green>{current_exp}'
    - ''
    - '<#5db5f1> ▸ 点击收集！'

storage_spawner_info_button:
  name: ''
  lore:

# ──────────────────────────────────────────────────────
#             Filter Configuration GUI
# ──────────────────────────────────────────────────────
gui_title_filter_config: '    允许           阻止'

filter_divider:
  name: '<white>掉落物 <#5db5f1>筛选'
  lore:
    - ''
    - ' <#5db5f1>ℹ 信息：'
    - '  <dark_gray>• <white>左侧：允许的物品'
    - '  <dark_gray>• <white>右侧：阻止的物品'
    - ''
    - '<#5db5f1> ▸ 点击返回存储！'

filter_item_allowed:
  name: '<white>{item_name}<#37eb9a> 已允许'
  lore:
    - '<#37eb9a> ▸ <white>点击阻止此物品！'

filter_item_blocked:
  name: '<white>{item_name}<#ff6b6b> 已阻止'
  lore:
    - '<#ff6b6b> ▸ <white>点击允许此物品！'

