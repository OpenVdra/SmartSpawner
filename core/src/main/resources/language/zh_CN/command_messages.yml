# ──────────────────────────────────────────────────────
#                     /ss editloot
# ──────────────────────────────────────────────────────
editloot:
  usage:
    message: "用法：&#37eb9a/ss editloot <刷怪笼名称>&f。示例：&#37eb9a/ss editloot blaze_spawner"
    sound: block.note_block.hat
  unknown_entry:
    message: "&#FF4444没有名为 &f{name}&#FF4444 的刷怪笼。使用 Tab 补全查看有效名称。"
    sound: block.note_block.bass
  entry_missing:
    message: "&#FF4444该条目已不在文件中。"
    sound: block.note_block.bass
  loot_added:
    message: "&#37eb9a已添加战利品条目 &f{label}&#37eb9a。"
    sound: entity.experience_orb.pickup
  loot_saved:
    message: "&#37eb9a已保存战利品条目 &f{label}&#37eb9a。"
    sound: entity.experience_orb.pickup
  loot_replaced:
    message: "&#37eb9a已更新 &f{label}&#37eb9a 的物品。"
    sound: entity.experience_orb.pickup
  loot_deleted:
    message: "&#FF6B6B已移除战利品条目 &f{label}&#FF6B6B。"
    sound: entity.item.pickup
  capture_empty:
    message: "&#FF4444请先在中间槽位放入物品。"
    sound: block.note_block.bass
