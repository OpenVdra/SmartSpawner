# SmartSpawner messages
# Full guide: https://docs.smartspawner.site/docs/language
# Colours: MiniMessage (<red>, <#5DB5F1>, <gradient:#5DB5F1:#FFFFFF>) or legacy (&c, &#5DB5F1).
# Each message can use message, title, subtitle, action_bar and sound. enabled: false mutes it.

prefix: '<#3498db>SmartSpawner <dark_gray>⏩ <reset>'

# {key}
missing_key:
  message: '<#ff4444>Eksik mesaj anahtarı: <white>{key}'

general:
  inventory_full:
    message: '<#ff4444>Envanterin dolu.'
  click_too_fast:
    message: '<#ff4444>Çok hızlı tıklıyorsun!'
    sound: block.note_block.bass
  action_in_progress:
    message: '<#f0c857>Şu anda devam eden bir işlem var. Lütfen bekle.'
    action_bar: '<#f0c857>İşlem sürüyor. Lütfen bekle.'
  action_failed:
    message: '<#ff4444>İşlem başarısız oldu. Lütfen tekrar dene.'
    action_bar: '<#ff4444>İşlem başarısız. Lütfen tekrar dene.'
  # {time}
  action_not_ready:
    message: '<#f0c857>Bu işlem henüz hazır değil. <white>{time} <#f0c857>sonra tekrar deneyin.'
    sound: block.note_block.bass

spawner:
  activated:
    message: 'Spawner başarıyla<green> aktif edildi. <reset>Artık düşen XP ve eşyaları toplayabilirsin.'
    sound: block.beacon.activate
  # {entity}
  entity_changed:
    message: 'Spawner <yellow>{entity} <white>türüne dönüştürüldü.'
    action_bar: '<white>Spawner <yellow>{entity} <white>oldu.'
    sound: entity.player.levelup

storage:
  empty:
    message: '<#ff4444>Spawner deposu şu an boş.'
  in_use:
    message: '<#ff4444>Bu spawner deposu şu anda başka bir oyuncu tarafından açık.'
    action_bar: '<#ff4444>Depo başka bir oyuncu tarafından kullanılıyor.'

# {exp} {exp_mending}
exp:
  none:
    message: '<#ff4444>Toplanacak XP bulunmuyor.'
  collected:
    message: '<green>{exp} <white>tecrübe puanı topladın.'
    action_bar: '<green>+{exp} XP'
  collected_mending:
    message: '<green>{exp} <white>tecrübe puanı topladın. <red>{exp_mending} <white>kadarı Tamir için harcandı.'
    action_bar: '<green>+{exp} XP <white>| <red>-{exp_mending} Tamir için kullanıldı'

stack:
  different_type:
    message: '<#ff4444>Spawnerları stacklemek için türleri aynı olmalıdır.'
    action_bar: '<#ff4444>Spawner türleri aynı olmalı.'
    sound: block.note_block.pling
  # {max}
  full:
    action_bar: '<#ff4444>Maksimum stack sınırına ulaştın: <white>{max}'
    sound: block.note_block.pling
  # {amount}
  success:
    action_bar: '<green>Başarıyla <white>{amount} <green>spawner stackledin.'
    sound: entity.player.levelup

break:
  no_permission:
    message: '<#ff4444>Bu spawnerı kırmak için yetkin yok.'
    sound: entity.villager.no
  silk_touch_required:
    message: '<#ff4444>Bu spawnerı kırmak için İpeksi Dokunuş büyüsü gerekiyor.'
    action_bar: '<#ff4444>İpeksi Dokunuş büyüsü gerekli.'
    sound: item.shield.block
  wrong_tool:
    message: '<#ff4444>Spawnerı bu aletle kıramazsın. Kazma kullanmalısın.'
    action_bar: '<#ff4444>Bu aletle kırılamaz.'
    sound: item.shield.block
  no_drop:
    message: '<#ff4444>Şanssızlık! Spawner kırıldı ama eşya olarak düşmedi.'
    action_bar: '<#ff4444>Spawner düşmedi.'
    sound: block.note_block.pling
  sneak_blocked:
    message: '<#ff4444>Bu spawnerda düşme şansı olduğu için tüm stacki tek seferde kıramazsın.'
    action_bar: '<#ff4444>Tüm stack aynı anda kırılamaz.'
    sound: block.note_block.pling

# {amount} {price} {exp} {exp_mending}
sell:
  nothing_to_sell:
    message: '<#ff4444>Satılabilecek hiçbir eşya bulunamadı.'
  success:
    message: '<yellow>{amount} <white>adet eşyayı <green>${price} <white>karşılığında sattın.'
    action_bar: '<green>+${price}'
  success_with_exp:
    message: '<yellow>{amount} <white>adet eşyayı <green>${price} <white>karşılığında sattın ve <green>{exp} <white>XP topladın.'
    action_bar: '<green>+${price} <white>| <green>+{exp} XP'
  success_with_exp_mending:
    message: '<yellow>{amount} <white>adet eşyayı <green>${price} <white>karşılığında sattın, <green>{exp} <white>XP topladın <white>(<red>{exp_mending} <white>Tamir için harcandı).'
    action_bar: '<green>+${price} <white>| <green>+{exp} XP <white>(<red>-{exp_mending} Tamir)'

command:
  player_only:
    message: '<#ff4444>Bu komutu sadece oyuncular kullanabilir.'
    sound: block.note_block.bass
  no_permission:
    message: '<#ff4444>Bunu yapmak için yetkin yok.'
    sound: block.note_block.pling

  list:
    no_spawners_found:
      message: '<#ff4444>Hiç spawner bulunamadı.'
      sound: block.note_block.pling
    teleported_to_spawner:
      message: 'Spawner konumuna ışınlandın.'
      sound: entity.enderman.teleport
    teleport_failed:
      message: '<#ff4444>Spawner konumuna ışınlanılamadı.'
      sound: entity.enderman.teleport
    spawner_removed:
      message: '<white>Spawner başarıyla <#ff4444>kaldırıldı<white>.'
      sound: entity.item.break

  # {value} {max} {property} {old_value} {new_value} {world} {x} {y} {z}
  set:
    usage:
      message: 'Kullanım: <#3498db>/ss set <stack_size|range|delay> <değer> [dünya x y z]'
      sound: block.note_block.hat
    invalid:
      message: '<#ff4444>Geçersiz değer veya Spawner konumu.'
      sound: block.note_block.pling
    stack_size_exceeds_max:
      message: '<#ff4444>Stack boyutu <white>{value}<#ff4444>, bu spawner''ın maksimum sınırını aşıyor: <white>{max}'
      sound: block.note_block.pling
    location_required:
      message: '<#f0c857>Konsol üzerinden kullanımda konum belirtilmelidir: <#3498db>/ss set <stack_size|range|delay> <değer> <dünya> \<x> \<y> \<z>'
      sound: block.note_block.pling
    success:
      message: '<#3498db>{world} {x} {y} {z} <white>konumundaki <green>{property} <white>değeri <yellow>{old_value} <white>yerine <green>{new_value} <white>olarak ayarlandı.'
      sound: entity.experience_orb.pickup

  # {percent} {count} {radius}
  near:
    bossbar:
      analyzing: 'Yakındaki spawnerlar taranıyor... %{percent}'
      found: '{radius} blok içinde {count} spawner bulundu.'
      not_found: '{radius} blok içinde hiç spawner bulunamadı.'
    view_gui:
      button: ' [Menüde Gör]'
      hover: 'Yakında bulunan {count} spawnerı incelemek için tıkla.'
    scan_start:
      message: '<yellow>{radius} <white>blok içindeki spawnerlar taranıyor...'
      sound: block.note_block.hat
    scan_found:
      message: '<yellow>{radius} <white>blok içinde <green>{count} <white>spawner bulundu. Vurgular <yellow>30sn <white>sürer.'
      sound: entity.experience_orb.pickup
    scan_none:
      message: '<white>{radius} <#ff4444>blok içinde hiç spawner bulunamadı.'
      sound: block.note_block.pling
    scan_cancelled:
      message: '<#f0c857>Tarama iptal edildi ve vurgular kaldırıldı.'
      sound: block.note_block.bass
    no_active_scan:
      message: '<#ff4444>İptal edilecek aktif bir taraman yok.'
      sound: block.note_block.bass
    highlights_expired:
      message: '<#888888>Spawner vurgularının süresi doldu.'

  # {amount} {entity} {player}
  give:
    player_not_found:
      message: '<#ff4444>Oyuncu bulunamadı.'
      sound: block.note_block.pling
    invalid_mob_type:
      message: '<#ff4444>Geçersiz yaratık türü veya spawner adı.'
      sound: block.note_block.pling
    invalid_item_type:
      message: '<#ff4444>Geçersiz eşya türü.'
      sound: block.note_block.pling
    invalid_item_spawner:
      message: '<#ff4444>Geçersiz eşya spawner adı.'
      sound: block.note_block.pling
    inventory_full:
      message: '<#ff4444>Envanter dolu olduğu için bazı spawnerlar yere düştü.'
      sound: block.note_block.pling
    spawner_received:
      message: '<green>{amount} <white>adet <green>{entity} <white>spawnerı aldın.'
      sound: entity.experience_orb.pickup
    spawner_given:
      message: '<#3498db>{player} <white>adlı oyuncuya <green>{amount} <white>adet <green>{entity} <white>spawnerı verildi.'
      sound: entity.experience_orb.pickup

  hologram:
    enabled:
      message: 'Tüm spawnerlar için hologramlar <green>aktif <white>edildi.'
      sound: entity.experience_orb.pickup
    disabled:
      message: 'Tüm spawnerlar için hologramlar <#ff4444>kapatıldı<white>.'
      sound: block.note_block.bass
    cleared:
      message: '<green>Tüm hologramlar <white>başarıyla temizlendi.'
      sound: entity.experience_orb.pickup
    clear_error:
      message: '<#ff4444>Hologramlar temizlenirken bir hata oluştu.'
      sound: block.note_block.pling

  # {count}
  clear:
    usage:
      message: 'Kullanım: <#3498db>/ss clear <holograms|ghost_spawners>'
      sound: block.note_block.hat
    ghost_check_start:
      message: 'Hatalı (Ghost) spawnerlar kontrol ediliyor...'
      sound: block.note_block.hat
    ghost_cleared:
      message: '<green>{count} <white>adet hatalı spawner başarıyla temizlendi.'
      sound: entity.experience_orb.pickup
    ghost_none_found:
      message: '<#ff4444>Hatalı (Ghost) spawner bulunamadı.'
      sound: entity.experience_orb.pickup

  prices:
    not_available:
      message: '<#ff4444>Satış entegrasyonu aktif değil. Lütfen ekonomi ayarlarını yapılandırın.'
      sound: block.note_block.pling
    no_priceable_items:
      message: '<#ff4444>Fiyatı olan hiçbir eşya bulunamadı.'
      sound: block.note_block.pling

  reload:
    start:
      message: '<#f0c857>Eklenti yenileniyor... Lütfen bekleyin.'
    success:
      message: '<#3498db>SmartSpawner <white>başarıyla yenilendi.'
      sound: entity.experience_orb.pickup
    error:
      message: '<#ff4444>SmartSpawner yenilenirken hata oluştu. Detaylar için konsola bakın.'
      sound: block.note_block.pling

  # {current} {available} {value} {old_value} {new_value}
  language:
    current:
      message: 'Mevcut dil: <green>{current} <#888888>| <white>Kullanılabilir: {available}'
      sound: block.note_block.hat
    invalid:
      message: '<#ff4444>Bilinmeyen dil: <white>{value}<#ff4444>. Şunları dene: <white>{available}'
      sound: block.note_block.pling
    already_set:
      message: '<#f0c857>Dil zaten <white>{value} <#f0c857>olarak ayarlı.'
      sound: block.note_block.hat
    success:
      message: 'Dil <yellow>{old_value} <white>yerine <green>{new_value} <white>olarak değiştirildi.'
      sound: entity.experience_orb.pickup
    error:
      message: '<#ff4444>Dil değiştirilemedi. Lütfen konsolu kontrol edin.'
      sound: block.note_block.pling

  # {current} {available} {value} {old_value} {new_value}
  gui_layout:
    current:
      message: 'Mevcut düzen: <green>{current} <#888888>| <white>Kullanılabilir: {available}'
      sound: block.note_block.hat
    invalid:
      message: '<#ff4444>Bilinmeyen menü düzeni: <white>{value}<#ff4444>. Şunları dene: <white>{available}'
      sound: block.note_block.pling
    already_set:
      message: '<#f0c857>Menü düzeni zaten <white>{value} <#f0c857>olarak ayarlı.'
      sound: block.note_block.hat
    success:
      message: 'Menü düzeni <yellow>{old_value} <white>yerine <green>{new_value} <white>olarak değiştirildi.'
      sound: entity.experience_orb.pickup
    error:
      message: '<#ff4444>Menü düzeni değiştirilemedi. Lütfen konsolu kontrol edin.'
      sound: block.note_block.pling

  # {name} {label}
  editloot:
    usage:
      message: 'Kullanım: <#37eb9a>/ss editloot <spawner adı><white>. Örnek: <#37eb9a>/ss editloot blaze_spawner'
      sound: block.note_block.hat
    unknown_entry:
      message: '<#ff4444>{name} adında bir spawner yok<#ff4444>. Geçerli adlar için tab tuşunu kullan.'
      sound: block.note_block.bass
    entry_missing:
      message: '<#ff4444>Bu kayıt artık dosyada değil.'
      sound: block.note_block.bass
    loot_added:
      message: '<#37eb9a>Ganimet kaydı <white>{label}<#37eb9a> eklendi.'
      sound: entity.experience_orb.pickup
    loot_saved:
      message: '<#37eb9a>Ganimet kaydı <white>{label}<#37eb9a> kaydedildi.'
      sound: entity.experience_orb.pickup
    loot_replaced:
      message: '<#37eb9a>{label}<#37eb9a> için eşya güncellendi.'
      sound: entity.experience_orb.pickup
    loot_deleted:
      message: '<#ff6b6b>{label}<#ff6b6b> ganimeti kaldırıldı.'
      sound: entity.item.pickup
    capture_empty:
      message: '<#ff4444>Önce ortadaki yuvaya bir eşya koy.'
      sound: block.note_block.bass
