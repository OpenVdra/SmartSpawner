# SmartSpawner GUI text
# Full guide: https://docs.smartspawner.site/docs/language
# Colours: MiniMessage (<red>, <#5DB5F1>, <gradient:#5DB5F1:#FFFFFF>) or legacy (&c, &#5DB5F1).

main:
  # {amount} {entity} {entity_small}
  title: '{entity} Spawner'
  title_stacked: '{amount}x {entity} Spawner'

  # {current_items} {max_slots} {percent_storage_rounded} {total_sell_price} {loot_items} {entity} {entity_small}
  storage:
    name: '<white>Depoyu <#5db5f1>Aç'
    lore:
      - ''
      - ' <#5db5f1>ℹ Bilgi:'
      - '  <dark_gray>• <white>Bu spawnerda biriken'
      - '   <white>tüm eşyaları buradan'
      - '   <white>görebilir ve yönetebilirsin.'
      - ''
      - ' <#5db5f1>★ Kapasite: <white>{percent_storage_rounded}%'
      - '{loot_items}'
      - ''
      - '<#5db5f1> ▸ Depoyu açmak için tıkla!'
    # One line of {loot_items}: {item_name} {amount} {raw_amount} {chance}
    loot_items: '  <dark_gray>• <white>{item_name}<white>: <yellow>{amount}'
    loot_items_empty: '  <dark_gray>• <white>Depoda eşya yok'

  # {entity} {entity_small} {stack_size} {range} {delay} {min_mobs} {max_mobs} {current_items} {max_items} {percent_storage_rounded} {percent_storage_decimal} {current_exp} {max_exp} {raw_current_exp} {raw_max_exp} {percent_exp_rounded} {percent_exp_decimal} {time} {total_sell_price}
  info:
    name: ' <white>Spawner <#5db5f1>Bilgisi'
    lore:
      - ''
      - ' <#5db5f1>ℹ İstatistikler:'
      - '   <dark_gray>• <white>Stack: <yellow>{stack_size}'
      - '   <dark_gray>• <white>Menzil: <yellow>{range} <white>blok'
      - '   <dark_gray>• <white>Doğma: <yellow>{min_mobs}<white>-<yellow>{max_mobs} <white>adet'
      - '   <dark_gray>• <white>Gecikme: <yellow>{delay} <white>saniye'
      - ''
      - ' <#5db5f1>★ Sonraki Doğma: <white>{time}'
      - '   <dark_gray>• <white>XP: <yellow>{percent_exp_rounded}%'
      - '   <dark_gray>• <white>Depo: <yellow>{percent_storage_rounded}%'
      - '   <dark_gray>• <white>Satış Değeri: <green>${total_sell_price}'
      - ''
      - '<#5db5f1> ▸ Sol Tık: <white>Satış yap & XP topla'
    # Used when the player cannot sell.
    lore_no_shop:
      - ''
      - ' <#5db5f1>ℹ İstatistikler:'
      - '   <dark_gray>• <white>Stack: <yellow>{stack_size}'
      - '   <dark_gray>• <white>Menzil: <yellow>{range} <white>blok'
      - '   <dark_gray>• <white>Doğma: <yellow>{min_mobs}<white>-<yellow>{max_mobs} <white>adet'
      - '   <dark_gray>• <white>Gecikme: <yellow>{delay} <white>saniye'
      - ''
      - ' <#5db5f1>★ Sonraki Doğma: <white>{time}'
      - '   <dark_gray>• <white>XP: <yellow>{percent_exp_rounded}%'
      - '   <dark_gray>• <white>Depo: <yellow>{percent_storage_rounded}%'
      - ''
    # Shown as {time} when the spawner is not counting down.
    lore_full: '<#ff4444>Kapasite Dolu'
    lore_inactive: '<#ff4444>İnaktif'
    lore_no_loot: '<#ff4444>Düşen Eşya Ayarlanmamış'

  # {current_exp} {max_exp} {percent_exp_rounded} {percent_exp_decimal}
  exp:
    name: '<white>XP <#5db5f1>Topla'
    lore:
      - ''
      - ' <#5db5f1>ℹ Bilgi:'
      - '  <dark_gray>• <white>Biriken XP''yi topla veya'
      - '   <white>Tamir basılı eşyalarını'
      - '   <white>onarmak için kullan.'
      - ''
      - ' <#5db5f1>★ Kapasite: <white>{percent_exp_rounded}%'
      - '  <dark_gray>• <white>Biriken XP: <green>{current_exp}<white>/<green>{max_exp}'
      - ''
      - '<#5db5f1> ▸ XP toplamak için tıkla!'

storage:
  # {current_page} {total_pages} {amount} {entity} {entity_small}
  title: '[{current_page}/{total_pages}] Spawner Deposu'
  # Used instead of title for a spawner that is not stacked.
  title_single: '[{current_page}/{total_pages}] Spawner Deposu'

  # {target_page}
  previous_page:
    name: '<#37eb9a>Önceki Sayfa'
    lore:
      - '<#2cc483> ▸ <#f8f8ff>Sayfa <#37eb9a>{target_page}<#f8f8ff>''e gitmek için tıkla'
  next_page:
    name: '<#37eb9a>Sonraki Sayfa'
    lore:
      - '<#2cc483> ▸ <#f8f8ff>Sayfa <#37eb9a>{target_page}<#f8f8ff>''e gitmek için tıkla'

  # {total_sell_price}
  sell:
    name: '<white>Eşyaları <green>Sat'
    lore:
      - ''
      - ' <green>ℹ Bilgi:'
      - '  <dark_gray>• <white>Depodaki tüm eşyaları'
      - '   <white>satıp paraya çevirirsin.'
      - ''
      - '<green> ▸ Satmak için tıkla!'
  sell_and_exp:
    name: '<white>Sat ve <green>XP Topla'
    lore:
      - ''
      - ' <green>ℹ Bilgi:'
      - '  <dark_gray>• <white>Tüm eşyaları satar ve'
      - '   <white>biriken XP''yi toplarsın.'
      - '  <dark_gray>• <white>Tahmini Kazanç: <green>${total_sell_price}'
      - ''
      - '<green> ▸ Devam etmek için tıkla!'

  back:
    name: '<white>Ana Menüye <#ff6b6b>Dön'
    lore:
      - ''
      - ' <#dadada>ℹ Bilgi:'
      - '  <dark_gray>• <white>Bir önceki menüye'
      - '   <white>dönmek için tıkla.'
      - ''
      - '<red> ▸ Geri dönmek için tıkla!'

  take_all:
    name: '<white>Hepsini <#5db5f1>Al'
    lore:
      - ''
      - ' <#5db5f1>ℹ Bilgi:'
      - '  <dark_gray>• <white>Bu sayfadaki tüm'
      - '   <white>eşyaları envanterine alırsın.'
      - ''
      - '<#5db5f1> ▸ Almak için tıkla!'

  filter:
    name: '<white>Düşenleri <#5db5f1>Filtrele'
    lore:
      - ''
      - ' <#5db5f1>ℹ Bilgi:'
      - '  <dark_gray>• <white>Bu spawner için izin verilen'
      - '   <white>ve engellenen eşyaları ayarla.'
      - ''
      - '<#5db5f1> ▸ Filtreleri ayarlamak için tıkla!'

  # {available_items} is the list built from selected_item, unselected_item and no_item ({item_name}).
  sort:
    name: '<white>Eşyaları <#5db5f1>Sırala'
    lore:
      - ''
      - '{available_items}'
      - ''
      - '<#5db5f1> ▸ Sıralamak için tıkla!'
    selected_item: ' <#5db5f1>• {item_name}'
    unselected_item: ' <white>• {item_name}'
    no_item: ' <gray>• Yok'

  drop_page:
    name: '<white>Hepsini <#ff6b6b>Yere At'
    lore:
      - ''
      - ' <#ff6b6b>⚠ Uyarı:'
      - '  <dark_gray>• <white>Bu sayfadaki tüm eşyaları'
      - '   <white>yere fırlatırsın.'
      - ''
      - '<#ff6b6b> ▸ Yere atmak için tıkla!'

  # {current_exp}
  collect_exp:
    name: '<white>XP <#5db5f1>Topla'
    lore:
      - ''
      - ' <#5db5f1>ℹ Bilgi:'
      - '  <dark_gray>• <white>Mevcut XP: <green>{current_exp}'
      - ''
      - '<#5db5f1> ▸ Toplamak için tıkla!'

  # Empty unless a layout places the info button in the storage. Same placeholders as main.storage.
  info:
    name: ''
    lore:

# {total_sell_price} {current_exp}
sell_confirm:
  title: 'Satışı Onayla'

  cancel:
    name: '<white>Satışı <#ff6b6b>İptal Et'
    lore:
      - ''
      - ' <#ff6b6b>⚠ Bilgi:'
      - '  <dark_gray>• <white>Hiçbir şey satmadan'
      - '   <white>geri dönmek için tıkla.'
      - ''
      - '<#ff6b6b> ▸ İptal etmek için tıkla!'

  confirm:
    name: '<white>Satışı <#5db5f1>Onayla'
    lore:
      - ''
      - ' <#5db5f1>ℹ Kazanacağın:'
      - '  <dark_gray>• <white>Para: <green>${total_sell_price}'
      - ''
      - '<#5db5f1> ▸ Satışı onaylamak için tıkla!'

  confirm_with_exp:
    name: '<white>Satışı Onayla <#5db5f1>ve XP Al'
    lore:
      - ''
      - ' <#5db5f1>ℹ Kazanacağın:'
      - '  <dark_gray>• <white>Para: <green>${total_sell_price}'
      - '  <dark_gray>• <white>XP: <green>{current_exp}'
      - ''
      - '<#5db5f1> ▸ Onaylamak için tıkla!'

  # {entity} {entity_small} {current_items} {max_items} {current_exp} {total_sell_price} {percent_storage_decimal} {percent_storage_rounded} {loot_items}
  summary:
    name: '<white>Satış <#5db5f1>Özeti'
    lore:
      - ''
      - ' <#5db5f1>ℹ Bilgi:'
      - '{loot_items}'
      - '  <dark_gray>• <green>+ <white>XP: <yellow>{current_exp}'
      - '  <dark_gray>• <green>+ <white>Para: <green>${total_sell_price}'
    # One line of {loot_items}: {amount} {item_name} {chance}
    loot_items: '  <dark_gray>• <#ff6b6b>- <white>{item_name}<white>: <yellow>{amount}'
    loot_items_empty: '  <dark_gray>• <#ff6b6b>- <white>Satılacak eşya yok'

filter:
  title: 'İzin Verilen           Engellenen'

  divider:
    name: '<white>Eşya <#5db5f1>Filtresi'
    lore:
      - ''
      - ' <#5db5f1>ℹ Bilgi:'
      - '  <dark_gray>• <white>Sol taraf: İzin verilen eşyalar'
      - '  <dark_gray>• <white>Sağ taraf: Engellenen eşyalar'
      - ''
      - '<#5db5f1> ▸ Depoya dönmek için tıkla!'

  # {item_name}
  allowed:
    name: '<white>{item_name}<#37eb9a> düşebilir'
    lore:
      - '<#37eb9a> ▸ <white>Bu eşyayı engellemek için tıkla!'
  blocked:
    name: '<white>{item_name}<#ff6b6b> engellendi'
    lore:
      - '<#ff6b6b> ▸ <white>Bu eşyaya izin vermek için tıkla!'

# The GUIs opened by commands: /ss list, /ss near, /ss prices and /ss editloot.
command:
  # {target_page} {previous_menu}
  navigation:
    previous_page:
      name: '<#37eb9a>Önceki Sayfa'
      lore:
        - '<#2cc483> ▸ <#37eb9a>{target_page}. <#f8f8ff>Sayfaya <#f8f8ff>dönmek için tıkla'
    next_page:
      name: '<#37eb9a>Sonraki Sayfa'
      lore:
        - '<#2cc483> ▸ <#37eb9a>{target_page}. <#f8f8ff>Sayfaya <#f8f8ff>gitmek için tıkla'
    close:
      name: '<#ff6b6b>Kapat'
      lore:
        - '<#ff6b6b> ▸ <white>Kapatmak için tıkla!'
    back:
      name: '<white>Geri Dön: <#ff6b6b>{previous_menu}'
      lore:
        - '<red> ▸ <white>Geri dönmek için tıkla!'
    # What {previous_menu} shows.
    menu_names:
      server_selection: 'Sunucu Seçimi'
      world_selection: 'Dünya Seçimi'
      spawner_list: 'Spawner Listesi'
      spawner_management: 'Spawner Yönetimi'

  list:
    # {server}. Only shown on cross-server setups.
    servers:
      title: 'Sunucu Seç'
      current:
        name: '<#37eb9a>{server}'
        lore:
          - ''
          - ' <#37eb9a>ℹ Durum:'
          - '  <dark_gray>• <white>Mevcut sunucu'
          - ''
          - '<#37eb9a> ▸ Spawnerları görmek için tıkla!'
      remote:
        name: '<#f0c857>{server}'
        lore:
          - ''
          - ' <#f0c857>ℹ Durum:'
          - '  <dark_gray>• <white>Uzak sunucu'
          - ''
          - '<#f0c857> ▸ Spawnerları görmek için tıkla!'

    # {world_name} {total} {total_stacked} {remote_world_lore} {server}
    worlds:
      title: 'Dünya Seç'
      title_server: '{server} Dünyaları'
      names:
        overworld: 'Normal Dünya'
        nether: 'Nether'
        the_end: 'End'
        custom: '{world_name} Dünyası'
      buttons:
        NORMAL:
          name: '<#37eb9a>{world_name}'
          lore:
            - ''
            - ' <#37eb9a>ℹ İstatistikler:'
            - '  <dark_gray>• <white>Spawner blokları: <yellow>{total}'
            - '  <dark_gray>• <white>Stacklenmiş spawnerlar: <yellow>{total_stacked}'
            - '{remote_world_lore}'
            - ''
            - '<#37eb9a> ▸ Listeyi açmak için tıkla!'
        NETHER:
          name: '<#ff6b6b>{world_name}'
          lore:
            - ''
            - ' <#ff6b6b>ℹ İstatistikler:'
            - '  <dark_gray>• <white>Spawner blokları: <yellow>{total}'
            - '  <dark_gray>• <white>Stacklenmiş spawnerlar: <yellow>{total_stacked}'
            - '{remote_world_lore}'
            - ''
            - '<#ff6b6b> ▸ Listeyi açmak için tıkla!'
        THE_END:
          name: '<#c8a2ff>{world_name}'
          lore:
            - ''
            - ' <#c8a2ff>ℹ İstatistikler:'
            - '  <dark_gray>• <white>Spawner blokları: <yellow>{total}'
            - '  <dark_gray>• <white>Stacklenmiş spawnerlar: <yellow>{total_stacked}'
            - '{remote_world_lore}'
            - ''
            - '<#c8a2ff> ▸ Listeyi açmak için tıkla!'
        CUSTOM:
          name: '<#5db5f1>{world_name}'
          lore:
            - ''
            - ' <#5db5f1>ℹ İstatistikler:'
            - '  <dark_gray>• <white>Spawner blokları: <yellow>{total}'
            - '  <dark_gray>• <white>Stacklenmiş spawnerlar: <yellow>{total_stacked}'
            - '{remote_world_lore}'
            - ''
            - '<#5db5f1> ▸ Listeyi açmak için tıkla!'
      remote_lore:
        - ''
        - ' <#f0c857>ℹ Uzak Dünya:'
        - '  <dark_gray>• <white>Sunucu: <yellow>{server}'

    # {current} {total} {world} {server} {available_options} {option_name} {id} {entity} {size} {status} {last_player} {x} {y} {z}
    spawners:
      title: '[{current}/{total}] {world}'
      title_remote: '[{current}/{total}] {world} ({server})'
      filter:
        name: '<white>Filtrele: <#5db5f1>Spawnerlar'
        lore:
          - ''
          - '{available_options}'
          - ''
          - '<#5db5f1> ▸ Filtreyi değiştirmek için tıkla!'
      filter_options:
        all: 'Tümü'
        active: 'Aktif'
        inactive: 'Pasif'
      sort:
        name: '<white>Sırala: <#5db5f1>Spawnerlar'
        lore:
          - ''
          - '{available_options}'
          - ''
          - '<#5db5f1> ▸ Sıralamayı değiştirmek için tıkla!'
      sort_options:
        default: 'Varsayılan (ID)'
        stack_size_asc: 'Stack miktarı (↑)'
        stack_size_desc: 'Stack miktarı (↓)'
      selected_option: ' <#5db5f1>• {option_name}'
      unselected_option: ' <white>• {option_name}'
      spawner:
        name: '<white>Spawner <#5db5f1>#{id}'
        lore:
          - ''
          - ' <#5db5f1>ℹ Bilgi:'
          - '  <dark_gray>• <white>Yaratık: <yellow>{entity}'
          - '  <dark_gray>• <white>Stack: <yellow>{size}'
          - '  <dark_gray>• <white>Durum: {status}'
          - '  <dark_gray>• <white>Son oyuncu: <yellow>{last_player}'
          - '  <dark_gray>• <white>Konum: <gray>x: {x}, y: {y}, z: {z}'
          - ''
          - '<#5db5f1> ▸ Bu spawnerı yönetmek için tıkla!'
        remote_lore:
          - ''
          - ' <#5db5f1>ℹ Bilgi:'
          - '  <dark_gray>• <white>Yaratık: <yellow>{entity}'
          - '  <dark_gray>• <white>Stack: <yellow>{size}'
          - '  <dark_gray>• <white>Durum: {status}'
          - '  <dark_gray>• <white>Son oyuncu: <yellow>{last_player}'
          - '  <dark_gray>• <white>Konum: <gray>x: {x}, y: {y}, z: {z}'
          - ''
          - '<#ff6b6b> ⚠ Uzak spawner yönetilemez!'
        last_player_none: 'Yok'
        status:
          active: '<#00e689>Aktif'
          inactive: '<#ff6b6b>Pasif'

    manage:
      title: 'Spawner Yönetimi'
      teleport:
        name: '<white>Işınlan: <#5db5f1>Spawner'
        lore:
          - '<#5db5f1> ▸ <white>Işınlanmak için tıkla!'
      open_spawner:
        name: '<white>Aç: <#5db5f1>Spawner Menüsü'
        lore:
          - '<#5db5f1> ▸ <white>Menüyü açmak için tıkla!'
      remove:
        name: '<white>Kaldır: <#ff6b6b>Spawner'
        lore:
          - '<#ff6b6b> ▸ <white>Bu spawnerı kaldırmak için tıkla!'

  # {current_page} {total_pages} {item_name} {price} {price_source} {custom_price} {shop_price}
  prices:
    title: '[{current_page}/{total_pages}] Satış Fiyatları'
    item:
      name: '<white>{item_name} <#5db5f1>Fiyatı'
      lore:
        - ''
        - ' <#5db5f1>ℹ Bilgi:'
        - '  <dark_gray>• <white>Son fiyat: <green>${price}'
        - '  <dark_gray>• <white>Kaynak: <yellow>{price_source}'
        - '  <dark_gray>• <white>Özel fiyat: <green>${custom_price}'
        - '  <dark_gray>• <white>Market fiyatı: <green>${shop_price}'

  # {entry} {label} {item} {amount} {chance} {durability} {max}
  editloot:
    mob_loot_title: 'Mob Ganimeti • {entry}'
    item_loot_title: 'Eşya Ganimeti • {entry}'
    capture_add_title: 'Eklemek için bir eşya bırak'
    capture_replace_title: 'Yeni eşyayı bırak'

    loot_entry:
      name: '<white>Ganimet <#37eb9a>{label}'
      lore:
        - ''
        - ' <#37eb9a>ℹ Bilgi:'
        - '  <dark_gray>• <white>Eşya: <yellow>{item}'
        - '  <dark_gray>• <white>Miktar: <yellow>{amount}'
        - '  <dark_gray>• <white>Şans: <yellow>{chance}%'
        - '  <dark_gray>• <white>Dayanıklılık: <yellow>{durability}'
        - ''
        - '<#37eb9a> ▸ <white>Değerleri düzenlemek için sol tıkla!'
        - '<#37eb9a> ▸ <white>Eşyayı değiştirmek için sağ tıkla!'

    loot_broken:
      name: '<white>Ganimet <#ff6b6b>{label}'
      lore:
        - ''
        - ' <#ff6b6b>⚠ Uyarı:'
        - '  <dark_gray>• <white>Bu eşya okunamadı.'
        - '  <dark_gray>• <white>Değer: <yellow>{item}'
        - ''
        - '<#ff6b6b> ▸ <white>Yeni bir eşya ayarlamak için sağ tıkla!'

    add_loot:
      name: '<white>Ganimet <#37eb9a>Ekle'
      lore:
        - ''
        - ' <#37eb9a>ℹ Bilgi:'
        - '  <dark_gray>• <white>Başka bir ganimet eşyası ekle.'
        - ''
        - '<#37eb9a> ▸ <white>Bir eşya seçmek için tıkla!'

    capture_hint:
      name: '<white>Eşyayı <#5db5f1>ortadaki yuvaya bırak'
      lore:
        - ''
        - ' <#5db5f1>ℹ Bilgi:'
        - '  <dark_gray>• <white>Eşya olduğu gibi kaydedilir.'
        - '  <dark_gray>• <white>Ayrıldığında geri alırsın.'

    cancel:
      name: '<white>Seçimi <#ff6b6b>İptal Et'
      lore:
        - ''
        - ' <#ff6b6b>ℹ Bilgi:'
        - '  <dark_gray>• <white>Bu seçimi geri al.'
        - ''
        - '<#ff6b6b> ▸ <white>İptal için tıkla!'

    confirm:
      name: '<white>Eşyayı <#37eb9a>Onayla'
      lore:
        - ''
        - ' <#37eb9a>ℹ Bilgi:'
        - '  <dark_gray>• <white>Miktar ve şansı ayarlamaya devam et.'
        - ''
        - '<#37eb9a> ▸ <white>Devam etmek için tıkla!'

    # Text inside the loot settings dialog. Keep it short.
    dialog_title:
      name: 'Ganimet Ayarları'
    dialog_body:
      name: '<gray>Miktar ve dayanıklılık <white>0-2<gray> gibi aralık kabul eder.'
    dialog_save:
      name: '<green>✔ <white>Kaydet'
    dialog_cancel:
      name: '<red>← <white>İptal'
    dialog_delete:
      name: '<dark_red>✖ <white>Ganimeti sil'
    field_amount:
      name: 'Miktar (örn. 1 veya 0-2)'
    field_chance:
      name: 'Şans % (0-100)'
    field_durability:
      name: 'Dayanıklılık (yoksa boş, örn. 1-384)'
    error_amount:
      name: '<red>Miktar 0-{max} arası tam sayı olmalı ve min, maksı geçmemeli.'
    error_chance:
      name: '<red>Şans 0 ile 100 arası bir sayı olmalı.'
    error_durability:
      name: '<red>Dayanıklılık tam sayı olmalı ve min, maksı geçmemeli.'
