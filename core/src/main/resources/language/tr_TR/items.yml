# SmartSpawner items and holograms
# Full guide: https://docs.smartspawner.site/docs/language
# Colours: MiniMessage (<red>, <#5DB5F1>, <gradient:#5DB5F1:#FFFFFF>) or legacy (&c, &#5DB5F1).
# A mob or material section overrides default key by key. Keys it leaves out come from default.

# {entity} {entity_small} {exp} {loot_items}. One line of {loot_items}: {amount} {item_name} {chance}
smart_spawner:
  default:
    name: '<#5db5f1>{entity} Spawner'
    loot_items: '  <#ecf0f1> • {amount}x {item_name} <#3498db>(%{chance})'
    loot_items_empty: '  <#ecf0f1> •  Yok'
    lore:
      - ''
      - ' <#5db5f1> Detay:'
      - '  <#ecf0f1> • <white>Verilen XP: <green>{exp}'
      - ''
      - ' <#5db5f1> Düşenler:'
      - '{loot_items}'
      - ''
  PIG:
    name: '<#ff77b7>{entity} Spawner'
    loot_items: '  <#fff0f7> • {amount}x {item_name} <#ff8fc7>(%{chance})'
    loot_items_empty: '  <#fff0f7> •  Yok'
    lore:
      - ''
      - ' <#ff77b7> Detay:'
      - '  <#fff0f7> • <white>Verilen XP: <#ff8fc7>{exp}'
      - ''
      - ' <#ff77b7> Düşenler:'
      - '{loot_items}'
      - ''
  BLAZE:
    name: '<#ffb300>{entity} Spawner'
    loot_items: '  <#fff4cc> • {amount}x {item_name} <#ffc107>(%{chance})'
    loot_items_empty: '  <#fff4cc> •  Yok'
    lore:
      - ''
      - ' <#ffb300> Detay:'
      - '  <#fff4cc> • <white>Verilen XP: <#ffd54f>{exp}'
      - ''
      - ' <#ffb300> Düşenler:'
      - '{loot_items}'
      - ''

