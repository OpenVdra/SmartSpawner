    lore:
      - ''
      - ' <#00e5ff> Detay:'
      - '  <#eafdff> • <white>Verilen XP: <#00b8d4>{exp}'
      - ''
      - ' <#00e5ff> Düşenler:'
      - '{loot_items}'
      - ''
  AMETHYST_SHARD:
    name: '<#b66cff>{entity} Spawner'
    loot_items: '  <#f5ecff> • {amount}x {item_name} <#d6a5ff>(%{chance})'
