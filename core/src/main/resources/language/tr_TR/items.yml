      - ''
      - ' <#b66cff> Detay:'
      - '  <#f5ecff> • <white>Verilen XP: <#d6a5ff>{exp}'
      - ''
      - ' <#b66cff> Düşenler:'
      - '{loot_items}'
      - ''

# Vanilla spawner eşyalarının envanterde ve araç ipuçlarındaki görünümü
# Kullanılabilir değişkenler: {entity}, {ᴇɴᴛɪᴛʏ}
# Özel vanilla spawner ismi ve lore'u kullanmak istemiyorsanız bu bölümü silebilirsiniz
vanilla_spawner:
  default:
    name: "{entity} Spawner"
    lore: