      - ''
  # Materyale özel bölümler, belirtilen anahtar için varsayılanı ezer. Belirtilmeyen anahtarlar varsayılanı kullanır.
  DIAMOND:
    name: '<#00e5ff>{entity} Spawner'
    loot_items: '  <#eafdff> • {amount}x {item_name} <#00b8d4>(%{chance})'
