# ──────────────────────────────────────────────────────
#              Loot Editor (/ss editloot)
# ──────────────────────────────────────────────────────
editloot:
  mob_loot_title: 'ᴍᴏʙ ʟᴏᴏᴛ • {entry}'
  item_loot_title: 'ɪᴛᴇᴍ ʟᴏᴏᴛ • {entry}'
  capture_add_title: 'ᴅʀᴏᴘ ᴀɴ ɪᴛᴇᴍ ᴛᴏ ᴀᴅᴅ'
  capture_replace_title: 'ᴅʀᴏᴘ ᴛʜᴇ ɴᴇᴡ ɪᴛᴇᴍ'

  loot_entry:
    name: '<white>ʟᴏᴏᴛ <#37eb9a>{label}'
    lore:
      - ''
      - ' <#37eb9a>ℹ ɪɴꜰᴏʀᴍᴀᴛɪᴏɴ:'
      - '  <dark_gray>• <white>Item: <yellow>{item}'
      - '  <dark_gray>• <white>Amount: <yellow>{amount}'
      - '  <dark_gray>• <white>Chance: <yellow>{chance}%'
      - '  <dark_gray>• <white>Durability: <yellow>{durability}'
      - ''
      - '<#37eb9a> ▸ <white>Left click to edit values!'
      - '<#37eb9a> ▸ <white>Right click to change the item!'

  loot_broken:
    name: '<white>ʟᴏᴏᴛ <#ff6b6b>{label}'
    lore:
      - ''
      - ' <#ff6b6b>⚠ ᴡᴀʀɴɪɴɢ:'
      - '  <dark_gray>• <white>This item could not be read.'
      - '  <dark_gray>• <white>Value: <yellow>{item}'
      - ''
      - '<#ff6b6b> ▸ <white>Right click to set a new item!'

  add_loot:
    name: '<white>ᴀᴅᴅ <#37eb9a>ʟᴏᴏᴛ'
    lore:
      - ''
      - ' <#37eb9a>ℹ ɪɴꜰᴏʀᴍᴀᴛɪᴏɴ:'
      - '  <dark_gray>• <white>Add another loot item.'
      - ''
      - '<#37eb9a> ▸ <white>Click to choose an item!'

  capture_hint:
    name: '<white>ᴅʀᴏᴘ ᴀɴ ɪᴛᴇᴍ <#5db5f1>ɪɴ ᴛʜᴇ ᴍɪᴅᴅʟᴇ'
    lore:
      - ''
      - ' <#5db5f1>ℹ ɪɴꜰᴏʀᴍᴀᴛɪᴏɴ:'
      - '  <dark_gray>• <white>The item is saved exactly as it is.'
      - '  <dark_gray>• <white>You get it back when you leave.'

  cancel:
    name: '<white>ᴄᴀɴᴄᴇʟ <#ff6b6b>ᴄᴀᴘᴛᴜʀᴇ'
    lore:
      - ''
      - ' <#ff6b6b>ℹ ɪɴꜰᴏʀᴍᴀᴛɪᴏɴ:'
      - '  <dark_gray>• <white>Discard this capture.'
      - ''
      - '<#ff6b6b> ▸ <white>Click to cancel!'

  confirm:
    name: '<white>ᴄᴏɴꜰɪʀᴍ <#37eb9a>ɪᴛᴇᴍ'
    lore:
      - ''
      - ' <#37eb9a>ℹ ɪɴꜰᴏʀᴍᴀᴛɪᴏɴ:'
      - '  <dark_gray>• <white>Continue to set amount and chance.'
      - ''
      - '<#37eb9a> ▸ <white>Click to continue!'

  # Dialog text. Rendered inside the client dialog, so keep it short.
  dialog_title:
    name: 'ʟᴏᴏᴛ ꜱᴇᴛᴛɪɴɢꜱ'
  dialog_body:
    name: '<gray>Amount and durability accept a range like <white>0-2<gray>.'
  dialog_save:
    name: '<green>✔ <white>Save'
  dialog_cancel:
    name: '<red>← <white>Cancel'
  dialog_delete:
    name: '<dark_red>✖ <white>Delete loot'
  field_amount:
    name: 'Amount (e.g. 1 or 0-2)'
  field_chance:
    name: 'Chance % (0-100)'
  field_durability:
    name: 'Durability (blank for none, e.g. 1-384)'
  error_amount:
    name: '<red>Amount must be whole numbers 0-{max}, and min not above max.'
  error_chance:
    name: '<red>Chance must be a number from 0 to 100.'
  error_durability:
    name: '<red>Durability must be whole numbers, and min not above max.'
